<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spor Tahmin</title>
<style>
:root{
  --bg:#0a0e14;--bg2:#111721;--bg3:#161d29;--kart:#131a24;
  --cizgi:#1f2937;--cizgi2:#2a3543;
  --yazi:#e8eef7;--yazi2:#8b98a9;--yazi3:#5a6675;
  --yesil:#22c55e;--yesil2:#16a34a;--mavi:#3b82f6;--mavi2:#2563eb;
  --sari:#eab308;--kirmizi:#ef4444;--mor:#8b5cf6;--turkuaz:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4655}
body{font-family:'Inter','Segoe UI Variable','Segoe UI',-apple-system,Roboto,Arial,sans-serif;
     background:var(--bg);color:var(--yazi);
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     line-height:1.5;min-height:100vh;overflow-x:hidden}

/* ═══ UST BAR ═══ */
header{background:linear-gradient(180deg,#131a24,#0f151e);border-bottom:1px solid var(--cizgi);
       padding:0 18px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;
       box-shadow:0 1px 3px rgba(0,0,0,.4);flex-wrap:nowrap;min-width:0}
#durum{margin-left:auto;display:flex;align-items:center;gap:11px;font-size:12px;color:var(--yazi2);
       flex-shrink:0;white-space:nowrap}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16.5px;letter-spacing:-.3px}
.logo .simge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--yesil),var(--turkuaz));
             display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 3px 10px rgba(34,197,94,.28)}
.marka-simge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
             background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(6,182,212,.1));
             border:1px solid rgba(34,197,94,.28);flex-shrink:0}
.marka-yazi{display:flex;flex-direction:column;line-height:1.15}
.m-ust{font-size:16.5px;font-weight:800;letter-spacing:.4px;color:var(--yazi)}
.m-vurgu{background:linear-gradient(135deg,#22c55e,#06b6d4);-webkit-background-clip:text;
         background-clip:text;-webkit-text-fill-color:transparent;margin-left:5px}
.m-alt{font-size:9.5px;color:var(--yazi3);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-top:1px}
#durum{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--yazi2)}
.nokta{width:7px;height:7px;border-radius:50%;background:var(--yesil);display:inline-block;
       box-shadow:0 0 8px var(--yesil);animation:nabiz 2s infinite}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.4}}
.btn-yenile{background:var(--bg3);border:1px solid var(--cizgi2);color:var(--yazi2);padding:6px 13px;
            border-radius:7px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn-yenile:hover{background:var(--cizgi);color:var(--yazi)}

/* ═══ IZLENEN MACLAR ═══ */
.takip{background:var(--bg2);border-bottom:1px solid var(--cizgi);padding:11px 22px;
       display:flex;align-items:center;gap:10px;overflow-x:auto;min-height:52px}
.takip::-webkit-scrollbar{height:0}
.canli-nokta{width:6px;height:6px;border-radius:50%;background:var(--kirmizi);display:inline-block;
             margin-right:5px;animation:nabiz 1.2s infinite;box-shadow:0 0 7px var(--kirmizi)}
.canli-mac{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(239,68,68,.04));
           border:1px solid rgba(239,68,68,.35);border-radius:8px;padding:7px 12px;
           display:flex;align-items:center;gap:9px;flex-shrink:0;font-size:12px;cursor:pointer;
           transition:.15s}
.canli-mac:hover{border-color:var(--kirmizi);background:rgba(239,68,68,.16)}
.canli-mac .dk{background:var(--kirmizi);color:#fff;font-size:10px;font-weight:700;
               padding:2px 6px;border-radius:4px;animation:nabiz 1.5s infinite}
.canli-mac .sk{color:var(--yesil);font-weight:700;font-family:'SF Mono',monospace;font-size:13px}
.canli-mac .lg{color:var(--yazi3);font-size:10px;margin-left:5px}
#canli-serit::-webkit-scrollbar{height:0}
/* KAYAN SERIT */
.kayan-kap{flex:1;overflow:hidden;position:relative;height:34px;display:flex;align-items:center;min-width:0}
.kayan-kap::before,.kayan-kap::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.kayan-kap::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
.kayan-kap::after{right:0;background:linear-gradient(270deg,var(--bg2),transparent)}
.kayan-ic{display:flex;gap:9px;white-space:nowrap;animation:kay 40s linear infinite;will-change:transform}
.kayan-ic:hover{animation-play-state:paused}
.kayan-ic.yavas{animation-duration:70s}
.kayan-ic.hizli{animation-duration:22s}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.canli-mac{flex-shrink:0}
.kayan-bos{color:var(--yazi3);font-size:11.5px;padding-left:6px}
/* Canli sayfada da ayni serit */
.canli-bar{background:linear-gradient(90deg,rgba(239,68,68,.1),rgba(239,68,68,.02));
           border-bottom:1px solid rgba(239,68,68,.22);padding:0 16px;height:40px;
           display:flex;align-items:center;gap:11px;overflow:hidden;margin:-18px -18px 16px}
.takip .et{font-size:10px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.7px;
           white-space:nowrap;font-weight:600}
.cip{background:var(--kart);border:1px solid var(--cizgi2);border-radius:7px;padding:6px 11px;
     font-size:11.5px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:.15s;flex-shrink:0}
.cip:hover{border-color:var(--mavi);background:#17202e}
.cip .canli{background:var(--kirmizi);color:#fff;font-size:8.5px;padding:2px 5px;border-radius:3px;
            font-weight:700;letter-spacing:.5px;animation:nabiz 1.4s infinite}
.cip .sk{color:var(--yesil);font-weight:700;font-family:'SF Mono',monospace}

/* ═══ ANA DUZEN ═══ */
main{display:grid;grid-template-columns:minmax(200px,240px) 1fr;height:calc(100vh - 112px)}
@media (max-width:1100px){
  main{grid-template-columns:190px 1fr}
  .logo{font-size:15px}
  .kutu-bas h2{font-size:13px}
  .mac-satir{padding:10px 13px}
  .takim{font-size:13px}
}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  aside{display:none}
  section{padding:14px}
}
aside{background:var(--bg2);border-right:1px solid var(--cizgi);overflow-y:auto;padding:14px 11px}
aside::-webkit-scrollbar{width:7px}
aside::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:4px}
.bolum-bas{font-size:10px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.8px;
           font-weight:700;padding:11px 9px 7px}
.lig{display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:8px;cursor:pointer;
     transition:.13s;margin-bottom:2px;font-size:13px;border:1px solid transparent}
.lig:hover{background:var(--bg3)}
.lig.aktif{background:linear-gradient(90deg,rgba(34,197,94,.14),rgba(34,197,94,.03));
           border-color:rgba(34,197,94,.32);color:var(--yesil);font-weight:600}
.lig .bayrak{font-size:15px;width:20px;text-align:center}
.lig .ad{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lig .say{font-size:10px;color:var(--yazi3);background:var(--bg3);padding:2px 6px;border-radius:4px}
.lig.aktif .say{background:rgba(34,197,94,.18);color:var(--yesil)}

/* ═══ ICERIK ═══ */
section{overflow-y:auto;padding:20px 24px}
section::-webkit-scrollbar{width:9px}
section::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:5px}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;margin-bottom:14px;overflow:hidden}
.kutu-bas{padding:13px 17px;border-bottom:1px solid var(--cizgi);display:flex;align-items:center;gap:10px}
.kutu-bas h2{font-size:13.5px;font-weight:600;letter-spacing:-.2px}
.kutu-bas .rozet{margin-left:auto;font-size:10.5px;color:var(--yazi3);background:var(--bg3);
                 padding:3px 9px;border-radius:5px;border:1px solid var(--cizgi2)}

/* MAC SATIRI */
.mac-satir{display:flex;align-items:center;gap:14px;padding:12px 17px;border-bottom:1px solid var(--cizgi);
           transition:.13s}
.mac-satir:last-child{border-bottom:0}
.mac-satir:hover{background:rgba(255,255,255,.03)}
.mac-satir:hover .logo{transform:scale(1.12)}
.logo{transition:transform .2s}
.mac-sol{min-width:96px}
.mac-tarih{font-size:11.5px;color:var(--yazi2);font-family:'SF Mono',ui-monospace,monospace}
.mac-saat{font-size:10px;color:var(--yazi3)}
.mac-orta{flex:1;display:flex;align-items:center;gap:11px;min-width:0}
.takim{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       display:flex;align-items:center;gap:8px}
.takim.ev{justify-content:flex-end}
.logo{width:26px;height:26px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.logo.buyuk{width:38px;height:38px}
.takim.ev{flex:1;text-align:right}
.takim.dep{flex:1}
.vs{color:var(--yazi3);font-size:10.5px;padding:3px 8px;background:var(--bg3);border-radius:5px;
    flex-shrink:0;font-weight:600}
.skor-kutu{background:var(--bg3);color:var(--yesil);font-weight:700;font-size:13px;padding:4px 11px;
           border-radius:6px;font-family:'SF Mono',monospace;flex-shrink:0}
.btn-tahmin{background:linear-gradient(135deg,var(--yesil2),var(--yesil));border:0;color:#fff;
            padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
            font-family:inherit;transition:.15s;box-shadow:0 2px 8px rgba(34,197,94,.22);white-space:nowrap}
.btn-tahmin:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(34,197,94,.34)}
.btn-tahmin:disabled{background:var(--bg3);color:var(--yazi3);box-shadow:none;transform:none;cursor:default}

/* ═══ TAHMIN SONUCU ═══ */
.analiz{background:linear-gradient(180deg,#0f1620,#0c1219);border:1px solid var(--cizgi);border-radius:12px;
        margin-bottom:14px;overflow:hidden;animation:ac .35s ease-out}
@keyframes ac{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
.analiz-bas{padding:15px 19px;background:linear-gradient(90deg,rgba(34,197,94,.09),transparent);
            border-bottom:1px solid var(--cizgi)}
.analiz-bas .mac-ad{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.analiz-bas .alt{font-size:11.5px;color:var(--yazi3)}

/* AJAN KARTI */
.ajan{background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(6,182,212,.06));
      border:1px solid rgba(34,197,94,.3);border-radius:11px;padding:16px;margin:16px 19px}
.ajan-bas{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ajan-bas .ikon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--yesil),var(--turkuaz));
                display:flex;align-items:center;justify-content:center;font-size:15px}
.ajan-bas .ad{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--yesil)}
.ajan .ozet{font-size:14.5px;font-weight:600;margin-bottom:13px;color:var(--yazi)}
.tav{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(0,0,0,.28);
     border-radius:8px;margin-bottom:6px;border-left:3px solid var(--yesil)}
.tav.orta{border-left-color:var(--sari)}
.tav .tip{font-size:9.5px;font-weight:700;color:var(--yazi3);background:var(--bg3);padding:3px 8px;
          border-radius:4px;min-width:78px;text-align:center;letter-spacing:.3px}
.tav .metin{flex:1;font-size:13px}
.tav .yuzde{font-weight:700;color:var(--yesil);font-size:14px;font-family:'SF Mono',monospace}
.tav.orta .yuzde{color:var(--sari)}
.uyari{font-size:12px;color:var(--sari);padding:6px 11px;background:rgba(234,179,8,.07);
       border-radius:6px;margin-top:5px;border-left:2px solid var(--sari)}
.sin-bas{font-size:10.5px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.6px;
         font-weight:700;margin:12px 0 7px}
.sin-liste{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sin{font-size:11.5px;color:var(--yazi2);padding:5px 10px;background:rgba(0,0,0,.22);border-radius:6px}
.form-sat{display:flex;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.form-takim{flex:1;min-width:180px;background:rgba(0,0,0,.24);border-radius:7px;padding:8px 11px;
            font-size:11.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form-takim>span:first-child{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdizi b{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:4px;
         font-size:10px;font-weight:700;margin-right:2px}
.fdizi b.g{background:rgba(34,197,94,.22);color:var(--yesil)}
.fdizi b.m{background:rgba(239,68,68,.2);color:var(--kirmizi)}
.fdizi b.b{background:rgba(234,179,8,.18);color:var(--sari)}
.fort{color:var(--yazi3);font-size:10.5px;font-family:'SF Mono',monospace}
/* GUVEN SKORU */
.gs{margin-bottom:13px}
.gs-bas{display:flex;justify-content:space-between;font-size:11px;color:var(--yazi3);
        text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:6px}
.gs-bas b{font-family:'SF Mono',monospace;font-size:13px}
.gs-bar{height:7px;background:#0d1117;border-radius:4px;overflow:hidden}
.gs-bar div{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
/* SENARYOLAR */
.sen-liste{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.sen{display:flex;align-items:center;gap:10px;padding:8px 11px;background:rgba(0,0,0,.24);
     border-radius:7px;font-size:12.5px;border-left:3px solid var(--cizgi2)}
.sen.ilk{border-left-color:var(--mavi);background:rgba(59,130,246,.07)}
.sen-skor{font-family:'SF Mono',monospace;font-weight:700;color:var(--mavi);min-width:36px}
.sen-txt{flex:1;color:var(--yazi2)}
.sen-yuz{font-weight:700;color:var(--yesil);font-family:'SF Mono',monospace}
/* SINYAL AGIRLIK */
.sin-a{float:right;color:var(--mavi);font-size:9px;letter-spacing:1px;opacity:.75}
.sin-y{margin-right:6px}
/* KOMBI */
.kombi{margin-top:12px;background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(59,130,246,.06));
       border:1px solid rgba(139,92,246,.3);border-radius:9px;padding:12px}
.kombi-bas{font-size:11px;color:var(--mor);text-transform:uppercase;letter-spacing:.6px;
           font-weight:700;margin-bottom:9px}
.kombi-sat{display:flex;align-items:center;gap:9px;padding:7px 10px;background:rgba(0,0,0,.28);
           border-radius:7px;margin-bottom:5px;font-size:12px}
.kombi-sat.guvenli{border-left:3px solid var(--yesil)}
.kombi-sat.riskli{border-left:3px solid var(--sari)}
.k-et{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--yazi3)}
.kombi-sat.guvenli .k-et{background:rgba(34,197,94,.16);color:var(--yesil)}
.kombi-sat.riskli .k-et{background:rgba(234,179,8,.16);color:var(--sari)}
.k-b{flex:1;font-size:11.5px}
.k-o{font-family:'SF Mono',monospace;font-weight:700;color:var(--mavi);font-size:12px}

/* 1X2 KARTLARI */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:16px 19px}
.analiz{max-width:100%;overflow:hidden}
.blk .cipler{display:flex;flex-wrap:wrap;gap:7px;max-width:100%}
.cip2{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.olas{background:var(--bg3);border:1px solid var(--cizgi2);border-radius:10px;padding:15px 11px;text-align:center;
      transition:.15s;position:relative;overflow:hidden}
.olas::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:var(--mavi)}
.olas.ev::before{background:var(--yesil)}.olas.ber::before{background:var(--sari)}.olas.dep::before{background:var(--kirmizi)}
.olas .yuzde{font-size:clamp(19px,2.2vw,26px);font-weight:800;letter-spacing:-.5px;
                     font-family:'SF Mono',ui-monospace,monospace;margin-bottom:3px;line-height:1.1}
.olas.ev .yuzde{color:var(--yesil)}.olas.ber .yuzde{color:var(--sari)}.olas.dep .yuzde{color:var(--kirmizi)}
.olas .etiket{font-size:10px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.olas .bar{height:4px;background:var(--bg);border-radius:2px;margin-top:9px;overflow:hidden}
.olas .bar div{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.olas.ev .bar div{background:var(--yesil)}.olas.ber .bar div{background:var(--sari)}.olas.dep .bar div{background:var(--kirmizi)}

/* BOLUM */
.blk{padding:16px 19px;border-top:1px solid var(--cizgi)}
.blk h3{font-size:11px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;
        margin-bottom:11px;display:flex;align-items:center;gap:7px}
.cipler{display:flex;flex-wrap:wrap;gap:7px}
.cip2{background:var(--bg3);border:1px solid var(--cizgi2);border-radius:7px;padding:7px 12px;font-size:12px;
      display:flex;align-items:center;gap:7px}
.cip2 b{color:var(--yazi);font-weight:600;font-family:'SF Mono',monospace}
.cip2 .iyi{color:var(--yesil)}
.cip2 .kotu{color:var(--kirmizi)}

/* SKOR TABLOSU */
.skorlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.skor{background:var(--bg3);border:1px solid var(--cizgi2);border-radius:8px;padding:9px 11px;
      display:flex;justify-content:space-between;align-items:center;transition:.13s}
.skor:hover{border-color:var(--mavi);transform:translateY(-2px)}
.skor.lider{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.07)}
.skor .s{font-weight:700;font-size:13.5px;font-family:'SF Mono',monospace}
.skor .y{font-size:11.5px;color:var(--mavi);font-weight:600}
.skor.lider .y{color:var(--yesil)}

/* DAGILIM */
.dagilim{display:flex;align-items:flex-end;gap:6px;height:88px;padding-top:8px}
.dagilim .sutun{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.dagilim .sutun .cubuk{width:100%;background:linear-gradient(180deg,var(--mavi),var(--mavi2));
                      border-radius:4px 4px 0 0;min-height:3px;transition:height .5s;position:relative}
.dagilim .sutun .cubuk:hover{background:linear-gradient(180deg,var(--yesil),var(--yesil2))}
.dagilim .sutun .yuz{font-size:9.5px;color:var(--yazi2);font-weight:600;font-family:'SF Mono',monospace}
.dagilim .sutun .gol{font-size:9.5px;color:var(--yazi3)}

/* YUKLENIYOR */
.yukleyici{text-align:center;padding:70px 20px}
.skeleton{background:linear-gradient(90deg,#161d29 25%,#1f2937 50%,#161d29 75%);
          background-size:200% 100%;animation:parla 1.5s infinite;border-radius:7px;height:16px;margin-bottom:8px}
@keyframes parla{0%{background-position:200% 0}100%{background-position:-200% 0}}
.istatistik{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:16px 19px}
.ist-kart{background:#0d1117;border:1px solid var(--cizgi2);border-radius:9px;padding:11px;text-align:center;transition:.15s}
.ist-kart:hover{border-color:var(--mavi);transform:translateY(-2px)}
.ist-kart .d{font-size:19px;font-weight:800;font-family:'SF Mono',monospace;color:var(--mavi);margin-bottom:2px}
.ist-kart .b{font-size:9.5px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.5px}
.yukleyici .halka{width:44px;height:44px;border:3px solid var(--cizgi2);border-top-color:var(--yesil);
                  border-radius:50%;margin:0 auto 18px;animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.yukleyici p{color:var(--yazi2);font-size:13.5px;margin-bottom:5px}
.yukleyici small{color:var(--yazi3);font-size:11.5px;display:block;margin-bottom:14px}
.yuk-bar{width:230px;height:5px;background:var(--cizgi);border-radius:3px;margin:0 auto;overflow:hidden}
.yuk-bar div{height:100%;width:0;background:linear-gradient(90deg,var(--yesil),var(--turkuaz));
             border-radius:3px;transition:width .4s ease}
.yuk-adim{display:flex;justify-content:center;gap:7px;margin-top:14px;flex-wrap:wrap}
.yuk-adim span{font-size:10.5px;color:var(--yazi3);padding:3px 9px;border-radius:5px;background:var(--bg3)}
.yuk-adim span.aktif{background:rgba(34,197,94,.15);color:var(--yesil)}

.bos{text-align:center;padding:50px 20px;color:var(--yazi3);font-size:13px}
.hata2{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5;
       padding:12px 16px;border-radius:9px;font-size:13px;margin:16px 19px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="marka-simge">
      <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
        <circle cx="16" cy="16" r="14" stroke="url(#g1)" stroke-width="2"/>
        <path d="M16 6l3.2 2.3-1.2 3.8h-4L12.8 8.3z" fill="url(#g1)"/>
        <path d="M7.6 12.6l3.4-.8 2.1 3.3-2.1 3.3-3.4-.8z" fill="url(#g1)" opacity=".85"/>
        <path d="M24.4 12.6l3.4-.8v6.4l-3.4-.8-2.1-3.3z" fill="url(#g1)" opacity=".85"/>
        <path d="M13.4 20.2h5.2l1.3 4.1-3.9 2.4-3.9-2.4z" fill="url(#g1)"/>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="32" y2="32">
          <stop stop-color="#22c55e"/><stop offset="1" stop-color="#06b6d4"/>
        </linearGradient></defs>
      </svg>
    </div>
    <div class="marka-yazi">
      <span class="m-ust">SPOR<span class="m-vurgu">TAHMİN</span></span>
      <span class="m-alt">Canlı Maç Analiz Motoru</span>
    </div>
  </div>
  <div id="durum">
    <span><span class="nokta"></span> <span id="durum-yazi">Veri hazırlanıyor…</span></span>
    <a href="/canli" style="background:linear-gradient(135deg,#7c3aed,#a855f7);border:0;color:#fff;
       padding:6px 13px;border-radius:7px;font-size:11.5px;cursor:pointer;text-decoration:none;
       font-weight:600">⚡ Canlı Simülasyon</a>
    <button class="btn-yenile" onclick="yenile()">↻ Yenile</button>
  </div>
</header>

<div class="takip" id="takip">
  <span class="et"><span class="canli-nokta"></span> CANLI</span>
  <div class="kayan-kap">
    <div id="canli-serit" class="kayan-ic">
      <span class="kayan-bos">Canlı maç yok — maç saatlerinde burada akacak</span>
    </div>
  </div>
</div>

<main>
  <aside>
    <div class="bolum-bas">Ligler <span id="lig-sayac" style="float:right;font-size:10px;color:var(--yazi3);font-weight:400">—</span></div>
    <div style="padding:8px 10px 4px">
      <input id="lig-ara" type="text" placeholder="Lig ara…" oninput="ligListesi()"
             style="width:100%;padding:7px 10px;background:#0d1117;border:1px solid var(--cizgi2);
                    border-radius:7px;color:var(--yazi);font-size:12px;font-family:inherit;outline:none">
    </div>
    <div id="ligler"><div style="padding:14px;color:var(--yazi3);font-size:12px">Yükleniyor…</div></div>
  </aside>
  <section id="icerik">
    <div class="yukleyici">
      <div class="halka"></div>
      <p>Maç verileri çekiliyor…</p>
      <small>13 lig · FlashScore · OpenLigaDB</small>
    </div>
  </section>
</main>

<script>
let LIGLER=[], AKTIF=null, VERI={};
const BAYRAK={"Süper Lig":"🇹🇷","Premier League":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","La Liga":"🇪🇸","Serie A":"🇮🇹",
"Bundesliga":"🇩🇪","Ligue 1":"🇫🇷","Eredivisie":"🇳🇱","Şampiyonlar Ligi":"🏆","Avrupa Ligi":"🥈",
"Konferans Ligi":"🥉","Championship":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Bundesliga 2":"🇩🇪","MLS":"🇺🇸"};

async function durumKontrol(){
  const r=await fetch('/api/durum'); const d=await r.json();
  if(d.hazir){
    LIGLER=d.ligler;
    document.getElementById('durum-yazi').textContent=`${d.toplam.toLocaleString('tr')} maç · ${d.ligler.length} lig`;
    ligListesi();
    if(!AKTIF && d.ligler.length){ ligSec(d.ligler[0].ad); }
    return true;
  }
  document.getElementById('durum-yazi').textContent='Veri çekiliyor…';
  return false;
}

let LIG_FILTRE='';
function ligAra(v){ LIG_FILTRE=(v||'').toLowerCase(); ligListesi(); }
function ligListesi(){
  const ara=(document.getElementById('lig-ara')?.value||LIG_FILTRE).toLowerCase();
  // Oynanmis maci olanlar one, sonra alfabetik
  const sirali=[...LIGLER].sort((a,b)=>{
    if((b.oynanmis||0)!==(a.oynanmis||0)) return (b.oynanmis||0)-(a.oynanmis||0);
    return a.ad.localeCompare(b.ad,'tr');
  });
  const suz=sirali.filter(l=>!ara || l.ad.toLowerCase().includes(ara));
  let h='';
  suz.forEach(l=>{
    h+=`<div class="lig ${AKTIF===l.ad?'aktif':''}" onclick="ligSec('${l.ad.replace(/'/g,"\\'")}')">
      <span class="bayrak">${BAYRAK[l.ad]||l.bayrak||'⚽'}</span>
      <span class="ad">${l.ad}</span>
      <span class="say" title="${l.oynanmis} oynanmis / ${l.gelecek} gelecek">${l.oynanmis}</span></div>`;
  });
  document.getElementById('ligler').innerHTML=h||'<div style="padding:12px;color:var(--yazi3);font-size:12px">Eşleşen lig yok</div>';
  const sc=document.getElementById('lig-sayac');
  if(sc) sc.textContent = ara ? `${suz.length}/${LIGLER.length}` : `${LIGLER.length} lig`;
}

async function ligSec(ad){
  AKTIF=ad; ligListesi();
  const s=document.getElementById('icerik');
  s.innerHTML='<div class="yukleyici"><div class="halka"></div><p>Maçlar yükleniyor…</p></div>';
  const r=await fetch('/api/maclar/'+encodeURIComponent(ad));
  const d=await r.json();
  VERI[ad]=d;
  ciz(ad, d);
}

function ciz(ad, d){
  const s=document.getElementById('icerik');
  let h='';

  // GELECEK MACLAR
  if(d.gelecek && d.gelecek.length){
    h+=`<div class="kutu"><div class="kutu-bas"><h2>📅 Oynanacak Maçlar</h2>
        <span class="rozet">${d.gelecek.length} maç</span></div>`;
    d.gelecek.forEach((m,i)=>{
      h+=`<div class="mac-satir">
        <div class="mac-sol"><div class="mac-tarih">${m.tarih||'-'}</div><div class="mac-saat">${m.saat||''}</div></div>
        <div class="mac-orta">
          <span class="takim ev">${m.ev}${m.ev_logo?`<img class="logo" src="${m.ev_logo}" onerror="this.style.display='none'">`:''}</span>
          <span class="vs">VS</span>
          <span class="takim dep">${m.dep_logo?`<img class="logo" src="${m.dep_logo}" onerror="this.style.display='none'">`:''}${m.dep}</span>
        </div>
        <button class="btn-tahmin" onclick="tahmin('${m.ev.replace(/'/g,"\\'")}','${m.dep.replace(/'/g,"\\'")}','${ad.replace(/'/g,"\\'")}',this)">Tahmin Et</button>
      </div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div class="kutu"><div class="kutu-bas"><h2>📅 Oynanacak Maçlar</h2></div>
        <div class="bos">Bu lig için yaklaşan maç bulunamadı</div></div>`;
  }

  // SON SONUCLAR
  if(d.sonuclar && d.sonuclar.length){
    h+=`<div class="kutu"><div class="kutu-bas"><h2>📊 Son Sonuçlar</h2></div>`;
    d.sonuclar.forEach(m=>{
      h+=`<div class="mac-satir">
        <div class="mac-sol"><div class="mac-tarih">${m.tarih||'-'}</div></div>
        <div class="mac-orta">
          <span class="takim ev">${m.ev}${m.ev_logo?`<img class="logo" src="${m.ev_logo}" onerror="this.style.display='none'">`:''}</span>
          <span class="skor-kutu">${m.ev_gol} - ${m.dep_gol}</span>
          <span class="takim dep">${m.dep_logo?`<img class="logo" src="${m.dep_logo}" onerror="this.style.display='none'">`:''}${m.dep}</span>
        </div></div>`;
    });
    h+=`</div>`;
  }
  s.innerHTML=h;
}

async function tahmin(ev, dep, lig, btn){
  const s=document.getElementById('icerik');
  const eski=document.getElementById('analiz-kutu'); if(eski) eski.remove();
  btn.disabled=true; btn.textContent='⏳';
  const yuk=document.createElement('div');
  yuk.id='analiz-kutu';
  yuk.innerHTML='<div class="yukleyici"><div class="halka"></div><p>30.000 maç simüle ediliyor…</p><small>'+ev+' — '+dep+'</small></div>';
  s.insertBefore(yuk, s.firstChild);
  try{
    const r=await fetch('/api/tahmin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ev,dep,lig})});
    const d=await r.json();
    if(d.hata){ yuk.innerHTML=`<div class="hata2">${d.hata}</div>`; }
    else { yuk.innerHTML=analizHtml(d, ev, dep, lig); yuk.scrollIntoView({behavior:'smooth',block:'start'}); }
  }catch(e){ yuk.innerHTML=`<div class="hata2">Bağlantı hatası: ${e.message}</div>`; }
  btn.disabled=false; btn.textContent='Tahmin Et';
}

function analizHtml(d, ev, dep, lig){
  let h=`<div class="analiz">
    <div class="analiz-bas">
      <div class="mac-ad">${ev} <span style="color:var(--yazi3);font-weight:400">vs</span> ${dep}</div>
      <div class="alt">${lig} · ${d.kullanilan_mac} maç verisi · 30.000 simülasyon</div>
    </div>`;

  // AJAN
  if(d.ajan){
    h+=`<div class="ajan">
      <div class="ajan-bas"><div class="ikon">🤖</div><div class="ad">İstatistik Ajanı</div></div>
      <div class="ozet">${d.ajan.genel}</div>`;
    d.ajan.tavsiyeler.forEach(t=>{
      const kls=(t.guven==='ÇOK YÜKSEK'||t.guven==='YÜKSEK')?'':'orta';
      h+=`<div class="tav ${kls}"><span class="tip">${t.tip}</span><span class="metin">${t.tavsiye}</span>
          <span class="yuzde">%${t.olasilik}</span></div>`;
    });
    // GUVEN SKORU CUBUGU
    const gs = d.ajan.guven_skoru || 0;
    const gsRenk = gs>=70?'var(--yesil)':gs>=55?'#84cc16':gs>=42?'var(--sari)':'var(--kirmizi)';
    h+=`<div class="gs"><div class="gs-bas"><span>Güven Skoru</span><b style="color:${gsRenk}">${gs}/100</b></div>
        <div class="gs-bar"><div style="width:${gs}%;background:${gsRenk}"></div></div></div>`;

    // SENARYOLAR
    if(d.ajan.senaryolar && d.ajan.senaryolar.length){
      h+=`<div class="sin-bas">🔮 En Muhtemel Senaryolar</div><div class="sen-liste">`;
      d.ajan.senaryolar.forEach((s,i)=>{
        h+=`<div class="sen ${i===0?'ilk':''}"><span class="sen-skor">${s.skor}</span>
            <span class="sen-txt">${s.senaryo}</span><span class="sen-yuz">%${s.olasilik}</span></div>`;
      });
      h+=`</div>`;
    }

    // Sinyal dokumu (agirlikli)
    if(d.ajan.sinyaller && d.ajan.sinyaller.length){
      const ep = d.ajan.konsensus.ev_puan||0, dp = d.ajan.konsensus.dep_puan||0;
      h+=`<div class="sin-bas">Bağımsız Sinyaller — Konsensüs: <b style="color:var(--yesil)">Ev ${ep}</b> / <b style="color:var(--kirmizi)">Dep ${dp}</b></div>`;
      h+=`<div class="sin-liste">`;
      d.ajan.sinyaller.forEach(s=>{
        const a = s.agirlik||1;
        const nok = a>=3?'●●●':a>=2?'●●○':'●○○';
        h+=`<div class="sin"><span class="sin-y">${s.yon==='ev'?'🟢':'🔴'}</span>${s.metin}
            <span class="sin-a">${nok}</span></div>`;
      });
      h+=`</div>`;
    }

    // KOMBI ONERISI
    if(d.ajan.kombi && d.ajan.kombi.guvenli.bahisler.length){
      const g=d.ajan.kombi.guvenli, r=d.ajan.kombi.riskli;
      h+=`<div class="kombi"><div class="kombi-bas">🎫 Kombi Kupon Önerisi</div>`;
      if(g.bahisler.length){
        h+=`<div class="kombi-sat guvenli"><span class="k-et">GÜVENLİ</span>
            <span class="k-b">${g.bahisler.join(' + ')}</span>
            <span class="k-o">Oran ${g.oran||'-'}</span></div>`;
      }
      if(r.bahisler.length){
        h+=`<div class="kombi-sat riskli"><span class="k-et">RİSKLİ</span>
            <span class="k-b">${r.bahisler.join(' + ')}</span>
            <span class="k-o">Oran ${r.oran||'-'}</span></div>`;
      }
      h+=`</div>`;
    }
    // Form
    if(d.ajan.form_ev && d.ajan.form_dep){
      const fe=d.ajan.form_ev, fd=d.ajan.form_dep;
      const formRenk=(d)=>d.dizi.map(x=>x==='G'?'<b class="g">G</b>':x==='M'?'<b class="m">M</b>':'<b class="b">B</b>').join('');
      h+=`<div class="form-sat">`+
         `<div class="form-takim"><span>${ev}</span><span class="fdizi">${formRenk(fe)}</span>`+
         `<span class="fort">${fe.puan_ort.toFixed(1)} p/m · ${fe.atilan_ort.toFixed(1)}-${fe.yenilen_ort.toFixed(1)}</span></div>`+
         `<div class="form-takim"><span>${dep}</span><span class="fdizi">${formRenk(fd)}</span>`+
         `<span class="fort">${fd.puan_ort.toFixed(1)} p/m · ${fd.atilan_ort.toFixed(1)}-${fd.yenilen_ort.toFixed(1)}</span></div>`+
         `</div>`;
    }
    d.ajan.uyarilar.forEach(u=>{ h+=`<div class="uyari">${u}</div>`; });
    h+=`</div>`;
  }

  // HIZLI ISTATISTIK KARTLARI
  h+=`<div class="istatistik">
    <div class="ist-kart"><div class="d">${d.beklenen_skor}</div><div class="b">Beklenen Skor</div></div>
    <div class="ist-kart"><div class="d" style="color:var(--yesil)">%${d.ust_25}</div><div class="b">Üst 2.5</div></div>
    <div class="ist-kart"><div class="d" style="color:var(--sari)">%${d.kg_var}</div><div class="b">Karşılıklı Gol</div></div>
    <div class="ist-kart"><div class="d" style="color:var(--mor||#8b5cf6)">%${d['1X']}</div><div class="b">1X (Ev/Ber)</div></div>
    <div class="ist-kart"><div class="d">${d.kullanilan_mac}</div><div class="b">Maç Verisi</div></div>
  </div>`;

  // 1X2
  h+=`<div class="grid3">
    <div class="olas ev"><div class="yuzde">${d.ev_kazanma}%</div><div class="etiket">Ev Kazanır</div>
      <div class="bar"><div style="width:${d.ev_kazanma}%"></div></div></div>
    <div class="olas ber"><div class="yuzde">${d.beraberlik}%</div><div class="etiket">Berabere</div>
      <div class="bar"><div style="width:${d.beraberlik}%"></div></div></div>
    <div class="olas dep"><div class="yuzde">${d.dep_kazanma}%</div><div class="etiket">Deplasman</div>
      <div class="bar"><div style="width:${d.dep_kazanma}%"></div></div></div>
  </div>`;

  // Cifte sans
  h+=`<div class="blk"><h3>Çifte Şans</h3><div class="cipler">
    <div class="cip2">1X <b>%${d['1X']}</b></div>
    <div class="cip2">12 <b>%${d['12']}</b></div>
    <div class="cip2">X2 <b>%${d['X2']}</b></div>
  </div></div>`;

  // Alt/Ust
  h+=`<div class="blk"><h3>Alt / Üst</h3><div class="cipler">`;
  ['05','15','25','35','45'].forEach(e=>{
    const a=d['alt_'+e], u=d['ust_'+e];
    h+=`<div class="cip2">${e[0]}.${e[1]} <b class="${a>u?'iyi':'kotu'}">Alt %${a}</b> <b class="${u>a?'iyi':'kotu'}">Üst %${u}</b></div>`;
  });
  h+=`</div></div>`;

  // KG + Tek/Cift
  h+=`<div class="blk"><h3>Karşılıklı Gol & Tek/Çift</h3><div class="cipler">
    <div class="cip2">KG Var <b class="${d.kg_var>d.kg_yok?'iyi':'kotu'}">%${d.kg_var}</b></div>
    <div class="cip2">KG Yok <b class="${d.kg_yok>d.kg_var?'iyi':'kotu'}">%${d.kg_yok}</b></div>
    <div class="cip2">Tek <b>%${d.tek_gol}</b></div>
    <div class="cip2">Çift <b>%${d.cift_gol}</b></div>
  </div></div>`;

  // Ilk yari
  h+=`<div class="blk"><h3>İlk Yarı</h3><div class="cipler">
    <div class="cip2">Ev <b>%${d.iy_ev}</b></div>
    <div class="cip2">Ber <b>%${d.iy_ber}</b></div>
    <div class="cip2">Dep <b>%${d.iy_dep}</b></div>
    <div class="cip2">İY 0.5 Üst <b>%${d.iy_05_ust}</b></div>
    <div class="cip2">İY 1.5 Üst <b>%${d.iy_15_ust}</b></div>
  </div></div>`;

  // Toplam gol dagilim
  h+=`<div class="blk"><h3>Toplam Gol Dağılımı</h3><div class="dagilim">`;
  const anahtar=Object.keys(d.toplam_gol).map(Number).sort((a,b)=>a-b);
  const max=Math.max(...anahtar.map(k=>d.toplam_gol[k]));
  anahtar.forEach(k=>{
    const y=d.toplam_gol[k];
    h+=`<div class="sutun"><div class="yuz">${y}%</div>
        <div class="cubuk" style="height:${Math.max(3,y/max*58)}px"></div>
        <div class="gol">${k}</div></div>`;
  });
  h+=`</div></div>`;

  // En olasi skorlar
  h+=`<div class="blk"><h3>En Olası Skorlar</h3><div class="skorlar">`;
  d.skorlar.slice(0,12).forEach(([sk,p],i)=>{
    h+=`<div class="skor ${i===0?'lider':''}"><span class="s">${sk}</span><span class="y">%${p}</span></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="blk" style="color:var(--yazi3);font-size:11.5px">
    Beklenen skor: <b style="color:var(--yazi2)">${d.beklenen_skor}</b> · Ev ${d.ev_beklenen_gol} gol / Dep ${d.dep_beklenen_gol} gol
  </div>`;
  h+=`</div>`;
  return h;
}

async function yenile(){
  document.getElementById('durum-yazi').textContent='Yenileniyor…';
  await fetch('/api/yukle');
  setTimeout(durumKontrol, 3000);
}

async function sonuclariYukle(){
  // Ust seritteki canli sonuclar
  try{
    const r=await fetch('/api/durum'); const d=await r.json();
    if(!d.ligler || !d.ligler.length) return;
  }catch(e){}
}

// CANLI MACLAR (30 sn'de bir yenile)
async function canliYukle(){
  try{
    const r=await fetch('/api/canli'); const d=await r.json();
    const s=document.getElementById('canli-serit');
    if(!d.length){
      s.innerHTML='<span style="color:var(--yazi3);font-size:11.5px">Şu an canlı maç yok</span>';
      return;
    }
    s.innerHTML=d.map(m=>`<div class="canli-mac" title="${m.lig}">
      <span class="dk">${m.dakika||'?'}'</span>
      <span>${m.ev}</span><span class="sk">${m.ev_gol}-${m.dep_gol}</span><span>${m.dep}</span>
      <span class="lg">${m.bayrak||''} ${m.lig.split('—').pop().trim().slice(0,18)}</span>
    </div>`).join('');
  }catch(e){}
}

// Yukleme ilerleme animasyonu
let YUK_N=0;
function yukGuncelle(mesaj, alt, yuzde){
  const y=document.getElementById('yuk-yazi');
  const a=document.getElementById('yuk-alt');
  const i=document.getElementById('yuk-ilr');
  if(y) y.textContent=mesaj;
  if(a) a.textContent=alt;
  if(i) i.style.width=yuzde+'%';
}

// Baslat
(async function(){
  yukGuncelle('Maç verileri çekiliyor…', 'Dünya geneli ligler taranıyor', 8);
  let hazir=await durumKontrol();
  let deneme=0;
  while(!hazir && deneme<90){
    await new Promise(r=>setTimeout(r,2500));
    // Ilerleme guncelle
    const yz = Math.min(88, 8 + deneme*1.4);
    yukGuncelle(deneme<8 ? 'Maç verileri çekiliyor…' :
                deneme<20 ? 'Ligler analiz ediliyor…' :
                deneme<40 ? 'Takım verileri işleniyor…' :
                'Neredeyse hazır…',
                'Dünya geneli ligler taranıyor',
                yz);
    hazir=await durumKontrol();
    deneme++;
  }
  yukGuncelle('Hazır!', d_toplam(), 100);
  if(!hazir){
    document.getElementById('icerik').innerHTML='<div class="hata2">Veri çekilemedi — internet bağlantısını kontrol edip "Yenile" butonuna basın.</div>';
  }
  canliYukle();
  setInterval(canliYukle, 30000);
})();

function d_toplam(){
  try { return document.getElementById('durum-yazi').textContent; } catch(e){ return ''; }
}
</script>
