<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canlı Simülasyon</title>
<style>
:root{--bg:#0a0e14;--kart:#131a24;--cizgi:#1f2937;--cizgi2:#2a3543;
      --yazi:#e8eef7;--yazi2:#8b98a9;--yazi3:#5a6675;
      --yesil:#22c55e;--mavi:#3b82f6;--sari:#eab308;--kirmizi:#ef4444;--mor:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--yazi);padding:18px}
.wrap{max-width:1080px;margin:0 auto}
.geri-btn{display:inline-flex;align-items:center;gap:6px;background:#1a2332;border:1px solid var(--cizgi2);
          color:var(--yazi2);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:12.5px;
          font-weight:600;margin-bottom:12px;transition:.15s;font-family:inherit;cursor:pointer}
.geri-btn:hover{background:#243044;color:var(--yazi);border-color:var(--mavi);transform:translateX(-2px)}
h1{font-size:22px;color:var(--mavi);margin-bottom:3px}
.sub{color:var(--yazi3);font-size:12px;margin-bottom:16px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:16px;margin-bottom:13px}
label{display:block;font-size:11px;color:var(--yazi3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
select{width:100%;padding:10px;background:#0d1117;border:1px solid var(--cizgi2);border-radius:8px;
       color:var(--yazi);font-size:14px;margin-bottom:11px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#16a34a,#22c55e);border:0;border-radius:9px;
     color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.1)}
.btn.dur{background:linear-gradient(135deg,#b91c1c,#ef4444)}

/* KAYAN CANLI SERIT */
.canli-bar{background:linear-gradient(90deg,rgba(239,68,68,.1),rgba(239,68,68,.02));
           border-bottom:1px solid rgba(239,68,68,.22);padding:0 4px;height:38px;
           display:flex;align-items:center;gap:10px;overflow:hidden;margin-bottom:14px}
.kayan-kap{flex:1;overflow:hidden;position:relative;height:34px;display:flex;align-items:center;min-width:0}
.kayan-kap::before,.kayan-kap::after{content:'';position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none}
.kayan-kap::before{left:0;background:linear-gradient(90deg,var(--kart),transparent)}
.kayan-kap::after{right:0;background:linear-gradient(270deg,var(--kart),transparent)}
.kayan-ic{display:flex;gap:9px;white-space:nowrap;animation:kay 40s linear infinite}
.kayan-ic:hover{animation-play-state:paused}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.km{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:7px;
    background:linear-gradient(135deg,rgba(239,68,68,.13),rgba(239,68,68,.03));
    border:1px solid rgba(239,68,68,.3);font-size:11.5px}
.km .dk{background:var(--kirmizi);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.km .sk{color:var(--yesil);font-weight:700;font-family:'SF Mono',monospace}
.km .lg{color:var(--yazi3);font-size:9.5px}
.kayan-bos{color:var(--yazi3);font-size:11.5px}

/* SAHA */
/* ═══ GERCEK FUTBOL SAHASI — PROFESYONEL ═══ */
.saha{position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;height:300px;
      background:
        /* Ust spot isigi */
        radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255,255,255,.16), transparent 55%),
        /* Alt golge */
        radial-gradient(ellipse 130% 100% at 50% 115%, rgba(0,0,0,.5), transparent 60%),
        /* Cim seritleri */
        repeating-linear-gradient(90deg,#125a2c 0 7%, #0f5228 0 7%, #0d4823 7% 14%);
      border-top:2px solid #1d6b38;border-bottom:2px solid #1d6b38;
      border-left:3px solid #1d6b38;border-right:3px solid #1d6b38;
      box-shadow:
        inset 0 0 110px rgba(0,0,0,.62),
        inset 0 22px 45px rgba(0,0,0,.35),
        inset 0 -18px 36px rgba(0,0,0,.4)}
.saha::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 22%),
    linear-gradient(0deg, rgba(0,0,0,.28) 0%, transparent 30%)}
.saha::after{content:'';position:absolute;top:0;left:0;right:0;height:7px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.06)}

/* Saha cizgileri */
.cizgi{position:absolute;background:rgba(255,255,255,.5);pointer-events:none;
       box-shadow:0 0 3px rgba(255,255,255,.25);z-index:1}
.cizgi.orta-dikey{left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px)}
.cizgi.orta-yuvarlak{left:50%;top:50%;width:100px;height:100px;border:2px solid rgba(255,255,255,.5);
                     border-radius:50%;background:none;transform:translate(-50%,-50%);box-shadow:none}
.cizgi.orta-nokta{left:50%;top:50%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%)}
.cizgi.ceza-sol{left:0;top:50%;width:15%;height:54%;border:2px solid rgba(255,255,255,.5);
                border-left:0;transform:translateY(-50%);background:none;box-shadow:none}
.cizgi.ceza-sag{right:0;top:50%;width:15%;height:54%;border:2px solid rgba(255,255,255,.5);
                border-right:0;transform:translateY(-50%);background:none;box-shadow:none}
.cizgi.kale-sol{left:0;top:50%;width:5%;height:28%;border:2px solid rgba(255,255,255,.5);
                border-left:0;transform:translateY(-50%);background:none;box-shadow:none}
.cizgi.kale-sag{right:0;top:50%;width:5%;height:28%;border:2px solid rgba(255,255,255,.5);
                border-right:0;transform:translateY(-50%);background:none;box-shadow:none}
.cizgi.ust{left:0;right:0;top:11px;height:2px;border-radius:1px}
.cizgi.alt{left:0;right:0;bottom:11px;height:2px;border-radius:1px}
.cizgi.pen-sol{left:10%;top:50%;width:5px;height:5px;border-radius:50%;transform:translateY(-50%)}
.cizgi.pen-sag{right:10%;top:50%;width:5px;height:5px;border-radius:50%;transform:translateY(-50%)}
/* Kose yaylari */
.cizgi.kose{width:26px;height:26px;border:2px solid rgba(255,255,255,.5);border-radius:50%;background:none;box-shadow:none}
.cizgi.kose.sol-ust{left:-13px;top:-13px}
.cizgi.kose.sag-ust{right:-13px;top:-13px}
.cizgi.kose.sol-alt{left:-13px;bottom:-13px}
.cizgi.kose.sag-alt{right:-13px;bottom:-13px}

/* KALELER (gorsel) */
.kale{position:absolute;top:50%;transform:translateY(-50%);width:16px;height:66px;z-index:2;
      border:3px solid rgba(255,255,255,.85);border-radius:3px;
      background:repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 3px, transparent 3px 6px),
                 repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 3px, transparent 3px 6px);
      box-shadow:0 0 14px rgba(255,255,255,.25), inset 0 0 12px rgba(0,0,0,.5)}
.kale.sol{left:-2px;border-left:0;border-radius:0 4px 4px 0}
.kale.sag{right:-2px;border-right:0;border-radius:4px 0 0 4px}

/* ═══ OYUNCULAR — gomlek formu (profesyonel) ═══ */
.oyuncu{position:absolute;width:17px;height:20px;z-index:4;
        transition:all 1.05s cubic-bezier(.34,.08,.22,1);
        filter:drop-shadow(0 3px 5px rgba(0,0,0,.75))}
/* Yere dusen golge */
.oyuncu .golge{position:absolute;left:1px;bottom:-4px;width:15px;height:5px;border-radius:50%;
               background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);z-index:-1}
.oyuncu::before{content:'';position:absolute;left:2px;top:4px;width:13px;height:14px;
                border-radius:3px 3px 4px 4px;background:var(--forma,#22c55e);
                border:1.5px solid rgba(0,0,0,.35)}
.oyuncu::after{content:'';position:absolute;left:5.5px;top:-1px;width:6px;height:6px;
               border-radius:50%;background:#e8b98a;border:1px solid rgba(0,0,0,.35)}
.oyuncu .kol{position:absolute;width:4px;height:9px;background:var(--forma,#22c55e);
             border-radius:2px;border:1px solid rgba(0,0,0,.3);top:5px}
.oyuncu .kol.l{left:-1px;transform:rotate(12deg)}
.oyuncu .kol.r{right:-1px;transform:rotate(-12deg)}
/* Forma numarasi */
.oyuncu .no{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:7px;
            color:#fff;font-weight:800;text-shadow:0 1px 2px #000;font-family:'SF Mono',monospace;
            z-index:2;pointer-events:none}
/* Ev / Deplasman renkleri */
.oyuncu.ev{--forma:#22c55e}
.oyuncu.dep{--forma:#ef4444}
.oyuncu.kaleci{--forma:#f59e0b}

/* ═══ TOP ═══ */
.top{position:absolute;width:13px;height:13px;border-radius:50%;z-index:6;
     background:radial-gradient(circle at 32% 28%,#fff,#cbd5e1 60%,#64748b);
     box-shadow:0 2px 7px rgba(0,0,0,.75),0 0 12px rgba(255,255,255,.3);
     transition:all .75s cubic-bezier(.3,-0.4,.5,1.3)}
.top.vurus{box-shadow:0 2px 7px rgba(0,0,0,.75),0 0 22px rgba(34,197,94,.85);
           animation:topDon .6s linear}

/* ═══ SKOR TABELASI (ustte overlay) ═══ */
.tabela{position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:10;
        background:rgba(6,14,10,.93);border:2px solid #1d6b38;border-radius:9px;
        padding:7px 16px;display:flex;align-items:center;gap:13px;
        box-shadow:0 4px 18px rgba(0,0,0,.65);backdrop-filter:blur(7px);max-width:94%}
.tabela .tak{font-size:11.5px;font-weight:600;color:#e8eef7;white-space:nowrap;overflow:hidden;
             text-overflow:ellipsis;max-width:110px;display:flex;align-items:center;gap:6px}
.tabela .sk{font-size:22px;font-weight:800;font-family:'SF Mono',monospace;letter-spacing:1px;
            color:#fff;white-space:nowrap}
.tabela .sk .e{color:#4ade80}.tabela .sk .d{color:#f87171}.tabela .sk .t{color:#64748b}
.tabela .dk{background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;
            border-radius:6px;font-family:'SF Mono',monospace;min-width:38px;text-align:center}
.tabela .dk.bekle{background:#475569}
.tabela .dk.iy{background:#eab308;color:#000}
.tabela .tl{width:22px;height:22px;object-fit:contain}

/* GOL PATLAMASI */
.gol-patlama{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             z-index:20;pointer-events:none;font-size:72px;font-weight:900;letter-spacing:6px;
             color:#fff;text-shadow:0 0 30px #22c55e,0 6px 24px rgba(0,0,0,.9);
             animation:patlama 1.7s ease-out forwards;font-family:'SF Mono',monospace}
@keyframes patlama{0%{transform:scale(.3);opacity:0}
  18%{transform:scale(1.18);opacity:1}
  32%{transform:scale(1)}
  75%{opacity:1}
  100%{transform:scale(1.5);opacity:0}}
@keyframes topDon{0%{transform:scale(1)}50%{transform:scale(1.5) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
.skor{text-align:center;font-size:50px;font-weight:800;letter-spacing:4px;position:relative;z-index:2;
      font-family:'SF Mono',monospace;margin-bottom:4px}
.skor .e{color:var(--yesil)}.skor .d{color:var(--kirmizi)}.skor .t{color:#3a4553}
.skor.gol-e{animation:pate .9s ease-out}
.skor.gol-d{animation:pate .9s ease-out}
@keyframes pate{0%{transform:scale(1)}25%{transform:scale(1.22);text-shadow:0 0 30px currentColor}100%{transform:scale(1)}}
.adlar{display:flex;justify-content:space-between;position:relative;z-index:2;padding:0 6px;
       font-size:12.5px;color:#93a3b5;font-weight:500}
.logo{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.dk{text-align:center;margin-top:10px;position:relative;z-index:2}
.dk b{background:rgba(234,179,8,.16);color:var(--sari);padding:4px 14px;border-radius:20px;
      font-size:13px;font-weight:700;font-family:'SF Mono',monospace}
.dk b.canli{background:rgba(239,68,68,.18);color:var(--kirmizi);animation:nabiz 1.4s infinite}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.55}}
.zaman{display:flex;height:24px;border-radius:12px;overflow:hidden;border:1px solid var(--cizgi2);margin-bottom:7px}
.zaman div{transition:width .5s ease;display:flex;align-items:center;justify-content:center;
           font-size:10px;font-weight:700;color:#fff}
.zaman .ye{background:linear-gradient(90deg,#166534,#22c55e)}
.zaman .yb{background:#4b5563}
.zaman .yd{background:linear-gradient(90deg,#ef4444,#991b1b)}
.etiket3{display:flex;justify-content:space-between;font-size:10px;color:var(--yazi3);margin-bottom:14px}

/* AKIS */
.akis{max-height:280px;overflow-y:auto;padding-right:4px}
.akis::-webkit-scrollbar{width:6px}
.akis::-webkit-scrollbar-thumb{background:var(--cizgi2);border-radius:3px}
.olay{display:flex;align-items:center;gap:10px;padding:8px 11px;background:#0d1117;border-radius:7px;
      margin-bottom:5px;border-left:3px solid var(--cizgi2);animation:kay .3s ease-out}
@keyframes kay{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.olay.gol{border-left-color:var(--yesil);background:linear-gradient(90deg,rgba(34,197,94,.13),rgba(34,197,94,.03))}
.olay.gol-d{border-left-color:var(--kirmizi);background:linear-gradient(90deg,rgba(239,68,68,.13),rgba(239,68,68,.03))}
.olay.olay-b{border-left-color:var(--sari)}
.olay .d{color:var(--sari);font-weight:700;min-width:34px;font-family:'SF Mono',monospace;font-size:12.5px}
.olay .i{font-size:14px}
.olay .m{flex:1;font-size:12.5px}
.olay .s{margin-left:auto;color:var(--yazi3);font-family:'SF Mono',monospace;font-size:12px}

/* ISTATISTIK */
.ist{display:flex;flex-direction:column;gap:9px}
.ist-sat{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:11px;font-size:12px}
.ist-sat .sv{text-align:left;font-weight:700;color:var(--yesil);font-family:'SF Mono',monospace}
.ist-sat .sd{text-align:right;font-weight:700;color:var(--kirmizi);font-family:'SF Mono',monospace}
.ist-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#1a2129}
.ist-bar .be{background:var(--yesil);transition:width .5s ease}
.ist-bar .bd{background:var(--kirmizi);transition:width .5s ease}
.ist-et{text-align:center;font-size:10px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.5px}

/* MOMENTUM */
.mom{height:70px;display:flex;align-items:flex-end;gap:2px;padding-top:6px}
.mom .s{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s}
.mom .s.e{background:linear-gradient(180deg,var(--yesil),#166534)}
.mom .s.d{background:linear-gradient(180deg,var(--kirmizi),#7f1d1d)}

/* OLASILIK */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.olas{background:#0d1117;border:1px solid var(--cizgi2);border-radius:10px;padding:13px;text-align:center;position:relative;overflow:hidden}
.olas::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.olas.e::before{background:var(--yesil)}.olas.b::before{background:var(--sari)}.olas.d::before{background:var(--kirmizi)}
.olas .y{font-size:24px;font-weight:800;font-family:'SF Mono',monospace;margin-bottom:2px}
.olas.e .y{color:var(--yesil)}.olas.b .y{color:var(--sari)}.olas.d .y{color:var(--kirmizi)}
.olas .l{font-size:9.5px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.6px}
.et{display:inline-block;background:#1f6feb22;color:var(--mavi);border:1px solid #1f6feb44;
    padding:4px 9px;border-radius:6px;font-size:11px;margin:0 4px 4px 0}
.hata{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.32);color:#fca5a5;
      padding:12px;border-radius:9px;font-size:13px}
.yuk{text-align:center;padding:30px;color:var(--yazi2);font-size:13px}

/* ═══════════ MODERN SIK TASARIM ═══════════ */
:root{
  --golge-1:0 1px 2px rgba(0,0,0,.35);
  --golge-2:0 2px 6px rgba(0,0,0,.4);
  --golge-3:0 6px 16px rgba(0,0,0,.45);
  --golge-4:0 12px 32px rgba(0,0,0,.55);
}

/* Kartlar */
.kart{
  box-shadow:var(--golge-3), inset 0 1px 0 rgba(255,255,255,.04)!important;
  border:1px solid rgba(255,255,255,.07)!important;
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.kart:hover{box-shadow:var(--golge-4), inset 0 1px 0 rgba(255,255,255,.05)!important}

/* Butonlar */
.btn{
  box-shadow:var(--golge-2);
  transition:all .18s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.15), transparent 50%);
  opacity:0;transition:opacity .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--golge-3), 0 0 24px rgba(34,197,94,.35)}
.btn:hover::after{opacity:1}
.btn:active{transform:translateY(0);box-shadow:var(--golge-1)}
.btn.dur{box-shadow:var(--golge-2), 0 0 0 rgba(239,68,68,0)}
.btn.dur:hover{box-shadow:var(--golge-3), 0 0 24px rgba(239,68,68,.35)}

/* Geri butonu */
.geri-btn{
  box-shadow:var(--golge-1);
  transition:all .18s cubic-bezier(.4,0,.2,1);
}
.geri-btn:hover{
  transform:translateX(-3px);
  box-shadow:var(--golge-2), 0 0 14px rgba(59,130,246,.3);
}

/* Select kutulari */
select{
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4);
  transition:all .18s;
}
select:hover{border-color:var(--cizgi2)!important}
select:focus{
  outline:none;
  border-color:var(--mavi)!important;
  box-shadow:0 0 0 3px rgba(59,130,246,.15), inset 0 1px 3px rgba(0,0,0,.4);
}

/* Saha: derinlik */
.saha{
  box-shadow:inset 0 0 80px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4)!important;
}
.saha-blok{box-shadow:var(--golge-3), inset 0 1px 0 rgba(255,255,255,.04)}

/* Tabela: cam efekti + parlama */
.tabela{
  box-shadow:0 6px 24px rgba(0,0,0,.7), 0 0 0 1px rgba(34,197,94,.15), inset 0 1px 0 rgba(255,255,255,.06)!important;
}
.tabela .dk{
  box-shadow:0 2px 8px rgba(220,38,38,.5);
}

/* Oyuncular: golge */
.oyuncu{
  box-shadow:0 3px 8px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.3)!important;
}
.oyuncu.ev{box-shadow:0 3px 8px rgba(0,0,0,.7), 0 0 10px rgba(34,197,94,.35)!important}
.oyuncu.dep{box-shadow:0 3px 8px rgba(0,0,0,.7), 0 0 10px rgba(239,68,68,.35)!important}

/* Top: parlama */
.top{
  box-shadow:0 2px 8px rgba(0,0,0,.8), 0 0 16px rgba(255,255,255,.45)!important;
}

/* Olay satirlari */
.olay{
  box-shadow:var(--golge-1);
  transition:all .15s;
}
.olay:hover{transform:translateX(3px);box-shadow:var(--golge-2)}

/* Istatistik kartlari */
.olas{box-shadow:var(--golge-1);transition:all .2s}
.olas:hover{transform:translateY(-3px);box-shadow:var(--golge-3)}

/* Kayan serit */
.canli-bar{
  box-shadow:0 2px 12px rgba(239,68,68,.15), inset 0 -1px 0 rgba(239,68,68,.2);
}
.km{
  box-shadow:var(--golge-1);
  transition:all .15s;
}
.km:hover{transform:translateY(-2px);box-shadow:var(--golge-2), 0 0 14px rgba(239,68,68,.3)}

/* Canli nokta */
.canli-nokta{
  box-shadow:0 0 8px var(--kirmizi), 0 0 16px rgba(239,68,68,.5);
}

/* Scrollbar */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#2a3543,#1f2937);
  border-radius:5px;border:2px solid transparent;background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:#3a4655;background-clip:content-box}

/* Giris animasyonu */
@keyframes yukari{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kart{animation:yukari .3s cubic-bezier(.4,0,.2,1)}

</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="geri-btn" title="Ana sayfaya dön (ESC)">← Geri Dön <span style="opacity:.5;font-size:10px">ESC</span></a>
  <h1>⚽ Canlı Maç Simülasyonu</h1>
  <div class="sub">Maç dakika dakika oynanır — gol, kart, istatistik canlı akar</div>

  <div class="canli-bar">
    <span style="font-size:10px;color:var(--kirmizi);font-weight:700;letter-spacing:.7px;
                 background:rgba(239,68,68,.15);padding:4px 9px;border-radius:6px;flex-shrink:0">🔴 CANLI</span>
    <div class="kayan-kap">
      <div id="canli-kayan" class="kayan-ic">
        <span class="kayan-bos">Canlı maç yok — maç saatlerinde burada akacak</span>
      </div>
    </div>
  </div>

  <div class="kart">
    <label>LİG</label>
    <select id="lig" onchange="takimYukle()"><option value="">-- lig seç --</option></select>
    <div class="grid2">
      <div><label>EV SAHİBİ</label><select id="ev" onchange="rakipOtomatik()"></select></div>
      <div><label>DEPLASMAN <small style="color:#64748b;font-weight:400">(otomatik gelir)</small></label>
        <select id="dep"></select></div>
    </div>
    <div id="rakip-bilgi" style="margin:8px 0;font-size:13px;min-height:18px"></div>
    <button class="btn" id="btn" onclick="basla()">▶ SİMÜLASYONU BAŞLAT</button>
  </div>

  <div id="icerik"></div>
</div>

<script>
let ZAMAN=null, HIZ_MS=550;

async function ligleriYukle(){
  const r=await fetch('/api/durum'); const d=await r.json();
  if(!d.hazir){setTimeout(ligleriYukle,2500); return;}
  document.getElementById('lig').innerHTML='<option value="">-- lig seç --</option>'+
    d.ligler.map(l=>`<option>${l.ad}</option>`).join('');
}
async function ligDoldur(){
  const lig=document.getElementById('lig');
  const r=await fetch('/api/durum'); const d=await r.json();
  if(d.hazir && d.ligler && d.ligler.length){
    lig.innerHTML='<option value="">-- lig seç --</option>'+
      d.ligler.map(l=>`<option value="${l.ad}">${l.bayrak||'⚽'} ${l.ad} (${l.oynanmis} maç)</option>`).join('');
    return true;
  }
  lig.innerHTML='<option value="">⏳ Veri yükleniyor…</option>';
  return false;
}

async function takimYukle(){
  const lig=document.getElementById('lig').value;
  const e=document.getElementById('ev'), d=document.getElementById('dep');
  if(!lig){e.innerHTML='';d.innerHTML='';return;}
  const r=await fetch('/api/takimlar/'+encodeURIComponent(lig)); const t=await r.json();
  const o='<option value="">-- seç --</option>'+t.map(x=>`<option>${x}</option>`).join('');
  e.innerHTML=o; d.innerHTML=o;
}

// ═══ EV SAHIBI SECILINCE RAKIBI OTOMATIK GETIR ═══
async function rakipOtomatik(){
  const lig = document.getElementById('lig').value;
  const ev  = document.getElementById('ev').value;
  const dep = document.getElementById('dep');
  const bilgi = document.getElementById('rakip-bilgi');
  if(!ev){ if(bilgi) bilgi.innerHTML=''; return; }

  if(bilgi) bilgi.innerHTML='<span style="color:#94a3b8">🔍 Rakip aranıyor…</span>';
  try{
    const r = await fetch('/api/rakip?takim='+encodeURIComponent(ev)+'&lig='+encodeURIComponent(lig));
    const d = await r.json();
    if(d.bulundu){
      // Deplasman kutusuna rakibi yaz
      dep.value = d.dep;
      // Bilgi goster
      const t = d.taraf==='ev'
        ? `<b>${d.ev}</b> vs <b>${d.dep}</b>`
        : `<b>${d.ev}</b> vs <b>${d.dep}</b>`;
      if(bilgi){
        bilgi.innerHTML = '✅ Rakip otomatik bulundu: ' + t +
          (d.tarih ? ' <span style="color:#64748b">· '+d.tarih+(d.saat?' '+d.saat:'')+'</span>' : '') +
          (d.oynanmis ? ' <span style="color:#f59e0b">(oynanmış maç)</span>' : '');
      }
      // Saha takim adlarini guncelle
      const evT = document.getElementById('saha-ev');
      const depT = document.getElementById('saha-dep');
      if(evT) evT.textContent = d.ev;
      if(depT) depT.textContent = d.dep;
    } else {
      dep.value = '';
      if(bilgi) bilgi.innerHTML = '⚠️ Bu takım için maç bulunamadı — deplasmanı elle seçin';
    }
  }catch(e){
    if(bilgi) bilgi.innerHTML = '⚠️ Rakip bulunamadı: '+e.message;
  }
}

function durdur(){
  if(ZAMAN){clearInterval(ZAMAN); ZAMAN=null;}
  if(typeof TOP_ZAMAN!=='undefined' && TOP_ZAMAN){clearInterval(TOP_ZAMAN); TOP_ZAMAN=null;}
  const b=document.getElementById('btn');
  if(b){b.textContent='▶ TEKRAR BAŞLAT'; b.className='btn';}
}

async function basla(){
  durdur();
  const lig=document.getElementById('lig').value, ev=document.getElementById('ev').value, dep=document.getElementById('dep').value;
  const c=document.getElementById('icerik');
  if(!lig||!ev||!dep){c.innerHTML='<div class="kart"><div class="hata">Lig ve iki takım seçin</div></div>';return;}
  c.innerHTML='<div class="kart yuk">⏳ Maç verisi hazırlanıyor…</div>';
  let t;
  try{
    const knt=new AbortController();
    const zl=setTimeout(()=>knt.abort(),45000);
    const r=await fetch('/api/tahmin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ev,dep,lig}), signal:knt.signal});
    clearTimeout(zl);
    if(!r.ok) throw new Error('Sunucu hatasi '+r.status);
    t=await r.json();
  }catch(e){
    const m = e.name==='AbortError' ? 'Istek zaman asimi (45sn)' : 'Baglanti hatasi: '+e.message;
    c.innerHTML=`<div class="kart"><div class="hata">${m}</div></div>`;return;}
  if(t.hata){c.innerHTML=`<div class="kart"><div class="hata">${t.hata}</div></div>`;return;}
  // Logo alanlarini mac listesinden al
  const macR = await fetch('/api/maclarlogoslar/'+encodeURIComponent(lig)+'?ev='+encodeURIComponent(ev)+'&dep='+encodeURIComponent(dep));
  let logoData = {ev:null, dep:null};
  try { logoData = await macR.json(); } catch(e){}

  // Şablon
  c.innerHTML=`
  <div class="kart">
    <div class="saha" id="saha">
      <!-- Saha cizgileri -->
      <div class="cizgi orta-dikey"></div>
      <div class="cizgi orta-yuvarlak"></div>
      <div class="cizgi orta-nokta"></div>
      <div class="cizgi ceza-sol"></div>
      <div class="cizgi ceza-sag"></div>
      <div class="cizgi kale-sol"></div>
      <div class="cizgi kale-sag"></div>
      <div class="cizgi pen-sol"></div>
      <div class="cizgi pen-sag"></div>
      <div class="cizgi ust"></div>
      <div class="cizgi alt"></div>
      <!-- Kose yaylari -->
      <div class="cizgi kose sol-ust"></div>
      <div class="cizgi kose sag-ust"></div>
      <div class="cizgi kose sol-alt"></div>
      <div class="cizgi kose sag-alt"></div>
      <!-- Kaleler -->
      <div class="kale sol"></div>
      <div class="kale sag"></div>

      <!-- Skor tabelasi -->
      <div class="tabela">
        <span class="tak"><img id="evlogo" class="tl" src="" onerror="this.style.display='none'"><span id="ev-ad">${ev}</span></span>
        <span class="sk"><span class="e" id="se">0</span><span class="t">-</span><span class="d" id="sd">0</span></span>
        <span class="tak"><span id="dep-ad">${dep}</span><img id="deplogo" class="tl" src="" onerror="this.style.display='none'"></span>
        <span class="dk bekle" id="dkb">0'</span>
      </div>

      <!-- Oyuncular (JS dolduracak) -->
      <div id="oyuncular"></div>

      <!-- Top -->
      <div class="top" id="top"></div>

      <!-- Gol animasyonu -->
      <div id="gol-kat"></div>
    </div>
    <div class="zaman"><div class="ye" id="ze" style="width:${t.ev_kazanma}%">${t.ev_kazanma}%</div>
      <div class="yb" id="zb" style="width:${t.beraberlik}%">${t.beraberlik}%</div>
      <div class="yd" id="zd" style="width:${t.dep_kazanma}%">${t.dep_kazanma}%</div></div>
    <div class="etiket3"><span>EV KAZANIR</span><span>BERABERE</span><span>DEP KAZANIR</span></div>
    <div style="margin-bottom:12px"><span class="et">Beklenen: ${t.beklenen_skor}</span>
      <span class="et">Üst 2.5: ${t.ust_25}%</span><span class="et">KG: ${t.kg_var}%</span>
      <span class="et" id="ajan-et">${t.ajan?t.ajan.genel:''}</span></div>
    <div class="ist">
      <div class="ist-et">Topla Oynama</div>
      <div class="ist-sat"><span class="sv" id="pe">50%</span><div class="ist-bar"><div class="be" id="pbe" style="width:50%"></div><div class="bd" id="pbd" style="width:50%"></div></div><span class="sd" id="pd">50%</span></div>
      <div class="ist-et" style="margin-top:6px">Şut</div>
      <div class="ist-sat"><span class="sv" id="she">0</span><div class="ist-bar"><div class="be" id="shbe" style="width:50%"></div><div class="bd" id="shbd" style="width:50%"></div></div><span class="sd" id="shd">0</span></div>
      <div class="ist-et" style="margin-top:6px">Korner</div>
      <div class="ist-sat"><span class="sv" id="koe">0</span><div class="ist-bar"><div class="be" id="kobe" style="width:50%"></div><div class="bd" id="kobd" style="width:50%"></div></div><span class="sd" id="kod">0</span></div>
    </div>
    <div style="margin-top:14px"><div class="ist-et" style="text-align:left;margin-bottom:6px">Momentum</div>
      <div class="mom" id="mom"></div></div>
    <button class="btn dur" style="margin-top:14px" onclick="durdur()">⏹ DURDUR</button>
  </div>
  <div class="kart"><div style="font-size:11px;color:var(--yazi3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px">📺 Maç Akışı</div>
    <div class="akis" id="akis"></div></div>`;

  // Logolari yerlestir
  if(logoData.ev){ const el=document.getElementById('evlogo'); if(el){el.src=logoData.ev; el.style.display='';} }
  if(logoData.dep){ const el=document.getElementById('deplogo'); if(el){el.src=logoData.dep; el.style.display='';} }

  // ═══ SAHA MOTORU: oyuncular + top hareketi ═══
  const saha = document.getElementById('saha');
  const W = () => saha.clientWidth, H = () => saha.clientHeight;

  // Oyuncu yerlesimi (4-4-2 ev, 4-3-3 dep)
  let OYUNCULAR = [];
  function oyuncuKur(){
    const w = W(), h = H();
    OYUNCULAR = [];
    // EV (sol taraf) 11 oyuncu
    const evY = [[0.06,0.5],[0.14,0.2],[0.14,0.4],[0.14,0.6],[0.14,0.8],
                 [0.28,0.25],[0.28,0.5],[0.28,0.75],[0.40,0.3],[0.40,0.5],[0.40,0.7]];
    // DEP (sag taraf) 11 oyuncu
    const depY = [[0.94,0.5],[0.86,0.2],[0.86,0.4],[0.86,0.6],[0.86,0.8],
                  [0.72,0.25],[0.72,0.5],[0.72,0.75],[0.60,0.3],[0.60,0.5],[0.60,0.7]];
    evY.forEach((c,i)=>{ OYUNCULAR.push({x:c[0]*w, y:c[1]*h, tak:'ev', no:i===0?'GK':i}); });
    depY.forEach((c,i)=>{ OYUNCULAR.push({x:c[0]*w, y:c[1]*h, tak:'dep', no:i===0?'GK':i}); });

    const kap = document.getElementById('oyuncular');
    kap.innerHTML = OYUNCULAR.map((o,i)=>
      `<div class="oyuncu ${o.tak}${o.no==='GK'?' kaleci':''}" id="oy${i}" style="left:${o.x}px;top:${o.y}px">
         <span class="golge"></span>
         <span class="kol l"></span><span class="kol r"></span>
         <span class="no">${o.no}</span></div>`).join('');

    // Top orta yuvarlakta
    const t = document.getElementById('top');
    if(t){ t.style.left = (w/2-6)+'px'; t.style.top = (h/2-6)+'px'; }
  }
  oyuncuKur();
  // Pencere boyutu degisirse yeniden kur
  window.addEventListener('resize',()=>{ if(document.getElementById('saha')) oyuncuKur(); });

  // TOP HAREKETI (her 1.6 sn)
  const topEl = () => document.getElementById('top');
  let topX = 0.5, topY = 0.5;
  let TOP_ZAMAN = setInterval(()=>{
    if(!document.getElementById('saha')){ clearInterval(TOP_ZAMAN); return; }
    const w = W(), h = H();
    // Top saha icinde takilsin
    topX = Math.max(0.06, Math.min(0.94, topX + (Math.random()-0.5)*0.22));
    topY = Math.max(0.12, Math.min(0.88, topY + (Math.random()-0.5)*0.20));
    const t = topEl();
    if(t){ t.style.left = (topX*w-6)+'px'; t.style.top = (topY*h-6)+'px'; }

    // En yakin 2 oyuncu topa dogru kaysin (canlilik)
    const yakin = OYUNCULAR.map((o,i)=>{
      const d = Math.hypot(o.x-topX*w, o.y-topY*h);
      return {o,i,d};
    }).sort((a,b)=>a.d-b.d).slice(0,3);
    yakin.forEach(({o,i})=>{
      const el = document.getElementById('oy'+i);
      if(!el) return;
      const hedefX = topX*w + (o.tak==='ev'? -18: 18);
      const hedefY = topY*h + (Math.random()-0.5)*24;
      el.style.left = Math.max(6, Math.min(w-24, hedefX))+'px';
      el.style.top  = Math.max(30, Math.min(h-30, hedefY))+'px';
      o.x = Math.max(6, Math.min(w-24, hedefX));
      o.y = Math.max(30, Math.min(h-30, hedefY));
    });
  }, 1600);

  // Olayları üret (beklenen gollere göre)
  const eg=parseFloat(t.ev_beklenen_gol)||1.3, dg=parseFloat(t.dep_beklenen_gol)||1.1;
  const olaylar=[];
  const uret=(lam,taraf)=>{
    let top=0;
    for(let d=1;d<=90;d++){ if(Math.random() < lam/90) { olaylar.push({dk:d,taraf,tip:'gol'}); top++; } }
    return top;
  };
  uret(eg,'ev'); uret(dg,'dep');
  // Diğer olaylar
  const ekstra=[['Sarı kart','🟨'],['Korner','🚩'],['Şut','🎯'],['Ofsayt','🚫'],['Faul','⚡'],['Serbest vuruş','🎪']];
  for(let d=1;d<=90;d++){
    if(Math.random()<0.09){
      const e=ekstra[Math.floor(Math.random()*ekstra.length)];
      olaylar.push({dk:d,taraf:Math.random()<.5?'ev':'dep',tip:e[0],ikon:e[1]});
    }
  }
  olaylar.sort((a,b)=>a.dk-b.dk);

  // Simülasyon durumu
  let se=0,sd=0,idx=0,dk=0,pos=50,she=0,shd=0,koe=0,kod=0;
  const momVeri=[];

  ZAMAN=setInterval(()=>{
    const dkb=document.getElementById('dkb');
    if(!dkb){ clearInterval(ZAMAN); ZAMAN=null; return; }
    if(dk>=90){
      // MAC SONU
      dkb.textContent='MS'; dkb.className='dk bekle';
      const b=document.getElementById('btn');
      if(b){ b.textContent='▶ TEKRAR OYNAT'; b.className='btn'; }
      clearInterval(ZAMAN); ZAMAN=null;
      if(typeof TOP_ZAMAN!=='undefined' && TOP_ZAMAN){ clearInterval(TOP_ZAMAN); TOP_ZAMAN=null; }
      return;
    }
    dk++;
    if(dk===45){ dkb.textContent='İY'; dkb.className='dk iy'; }
    else { dkb.textContent=dk+"'"; dkb.className='dk'; }

    // Bu dakikadaki olaylar
    while(idx<olaylar.length && olaylar[idx].dk===dk){
      const o=olaylar[idx];
      let metin='', ikon=o.ikon||'•';

      if(o.tip==='gol'){
        if(o.taraf==='ev'){ se++;
          const el=document.getElementById('se'); el.textContent=se;
        } else { sd++;
          const el=document.getElementById('sd'); el.textContent=sd;
        }
        // ⚽ SAHA ICINDE GOL PATLAMASI
        const gk = document.getElementById('gol-kat');
        if(gk){
          const p2 = document.createElement('div');
          p2.className = 'gol-patlama';
          p2.textContent = 'GOL!';
          p2.style.color = o.taraf==='ev' ? '#4ade80' : '#f87171';
          gk.appendChild(p2);
          setTimeout(()=>p2.remove(), 1800);
        }
        // Top kaleye gitsin
        const w2 = W(), h2 = H();
        const t2 = topEl();
        if(t2){
          t2.classList.add('vurus');
          topX = o.taraf==='ev' ? 0.93 : 0.07;
          topY = 0.5;
          t2.style.left = (topX*w2-6)+'px';
          t2.style.top = (topY*h2-6)+'px';
          setTimeout(()=>t2.classList.remove('vurus'), 700);
        }
        // Kaleci topu alamasin (gol!) - kutlama
        ikon='⚽'; metin='GOL! '+(o.taraf==='ev'?ev:dep);
      } else if(o.tip==='Şut'){
        ikon='🎯'; metin=(o.taraf==='ev'?ev:dep)+' şut çekti';
        if(o.taraf==='ev') she++; else shd++;
        document.getElementById('she').textContent=she;
        document.getElementById('shd').textContent=shd;
      } else if(o.tip==='Korner'){
        ikon='🚩'; metin=(o.taraf==='ev'?ev:dep)+' korner kazandı';
        if(o.taraf==='ev') koe++; else kod++;
        document.getElementById('koe').textContent=koe;
        document.getElementById('kod').textContent=kod;
      } else if(o.tip==='Sarı kart'){
        ikon='🟨'; metin=(o.taraf==='ev'?ev:dep)+' sarı kart gördü';
      } else {
        metin=(o.taraf==='ev'?ev:dep)+' — '+o.tip;
      }

      // Topla oynama (gol/şut/korner ile kayar)
      if(o.taraf==='ev') pos=Math.min(72,pos+ (o.tip==='gol'?4:1.6));
      else pos=Math.max(28,pos- (o.tip==='gol'?4:1.6));

      const ak=document.getElementById('akis');
      if(ak){
        const el=document.createElement('div');
        el.className='olay'+(o.tip==='gol'?(o.taraf==='ev'?' gol':' gol-d'):(o.tip==='Sarı kart'?' olay-b':''));
        el.innerHTML=`<span class="d">${o.dk}'</span><span class="i">${ikon}</span><span class="m">${metin}</span><span class="s">${se}-${sd}</span>`;
        ak.insertBefore(el, ak.firstChild);
        while(ak.children.length>50) ak.removeChild(ak.lastChild);
      }
      idx++;
    }

    // İstatistik güncelle (null guvenli)
    const setTxt=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
    const setW=(id,v)=>{ const e=document.getElementById(id); if(e) e.style.width=v+'%'; };
    setTxt('pe', Math.round(pos)+'%');
    setTxt('pd', Math.round(100-pos)+'%');
    setW('pbe', pos); setW('pbd', 100-pos);
    const shT=she+shd||1;
    setW('shbe', she/shT*100); setW('shbd', shd/shT*100);
    const koT=koe+kod||1;
    setW('kobe', koe/koT*100); setW('kobd', kod/koT*100);

    // Momentum: her dakika topla oynama degisimi (gercek veri)
    momVeri.push({ev:pos, dep:100-pos});
    const mom=document.getElementById('mom');
    if(mom){
      const son=momVeri.slice(-40);
      mom.innerHTML=son.map(x=>{
        const yon = x.ev>=50 ? 'e' : 'd';
        const yuzde = yon==='e' ? x.ev : x.dep;
        const h=Math.max(5, Math.round((yuzde-50)/50*64)+8);
        return `<div class="s ${yon}" style="height:${h}px" title="Top %${Math.round(x.ev)}"></div>`;
      }).join('');
    }
  }, HIZ_MS);
}

// CANLI MACLARI KAYAN SERIDE GOSTER
async function kayanYukle(){
  try {
    const r = await fetch('/api/canli'); const d = await r.json();
    const k = document.getElementById('canli-kayan');
    if(!k) return;
    if(!d || !d.length){
      k.innerHTML = '<span class="kayan-bos">Canlı maç yok — maç saatlerinde burada akacak</span>';
      return;
    }
    const html = d.map(m=>`<span class="km">
      <span class="dk">${m.dakika||'?'}</span>
      <span>${m.ev}</span><span class="sk">${m.ev_gol}-${m.dep_gol}</span><span>${m.dep}</span>
      <span class="lg">${m.lig||''}</span></span>`).join('');
    // Kesintisiz akis icin 2 kez yaz
    k.innerHTML = html + html;
  } catch(e){}
}
setInterval(kayanYukle, 10000);
kayanYukle();

// ESC ile geri don
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ window.location.href='/'; }
});

// Başlat — veri hazır olana kadar bekle
(async function(){
  let n=0;
  while(n<120){
    if(await ligDoldur()) break;
    await new Promise(r=>setTimeout(r,2500));
    n++;
  }
  // Veri yoksa yenilemeyi tetikle
  if(n>=120){
    document.getElementById('lig').innerHTML='<option value="">Veri yüklenemedi — "Yenile" bas</option>';
  }
})();
</script>
</body>
</html>
