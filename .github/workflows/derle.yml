name: Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pip
        run: |
          python -m pip install --upgrade pip
          pip install flask pywebview pyinstaller numpy

      - name: Derle
        run: pyinstaller --onedir --noconsole --name SporTahmin --version-file surum.txt --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug --hidden-import=webview --hidden-import=numpy --hidden-import=mega_ajan --hidden-import=mega_karar --collect-all webview --collect-all numpy main.py

      - name: Exe boyut
        shell: bash
        run: ls -la dist/SporTahmin/

      # ═══ WINDOWS GERCEK TEST ═══
      - name: EXE CALISTIR + HTTP TEST
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\SporTahmin\SporTahmin.exe" -PassThru
          Write-Host "PID: $($p.Id)"
          Start-Sleep -Seconds 45
          $procs = Get-Process | Where-Object {$_.MainWindowTitle -ne ""}
          foreach ($x in $procs) { Write-Host ("Pencere: " + $x.ProcessName + " | " + $x.MainWindowTitle) }
          Write-Host "=== HTTP TEST ==="
          for ($i=1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/" -TimeoutSec 8 -UseBasicParsing
              Write-Host ("HTTP_KOD: " + $r.StatusCode)
              $ic = $r.Content
              Write-Host ("UZUNLUK: " + $ic.Length)
              Write-Host ("BASLIK: " + ($ic -match "Canl. Ma. Analiz"))
              Write-Host ("SAHA_BLOK: " + ($ic -match "saha-blok"))
              Write-Host ("TAHMIN_SAHA: " + ($ic -match "tahmin-saha"))
              Write-Host ("OYUNCU_CSS: " + ($ic -match "oyuncu.ev"))
              Write-Host ("TOP_CSS: " + ($ic -match "class=.top."))
              Write-Host ("SAHA_BASLA: " + ($ic -match "function sahaBasla"))
              Write-Host ("GOL_ANIM: " + ($ic -match "gol-patlama"))
              Write-Host ("ABORT: " + ($ic -match "AbortController"))
              Write-Host ("SKOR_KARTI: " + ($ic -match "En Olas"))
              Write-Host ("ULKE_GRUP: " + ($ic -match "ulke-bas"))
              Write-Host ("BAYRAK: " + ($ic -match "ULKE_BAYRAK"))
              Write-Host ("GERI_BUTON: " + ($ic -match "analizKapat"))
              Write-Host ("KAYAN_TIKLA: " + ($ic -match "canliMaciAc"))
              Write-Host ("SAHA_MOTOR: " + ($ic -match "oyuncuyaGit"))
              Write-Host ("HTML_KAPANIS: " + $ic.TrimEnd().EndsWith("</html>"))
              break
            } catch { Write-Host ("Deneme " + $i + " basarisiz"); Start-Sleep -Seconds 5 }
          }

      - name: TAHMIN TESTI
        shell: powershell
        run: |
          try {
            # Veri hazir olana kadar bekle (max 60 sn)
            $dd = $null
            for ($w = 0; $w -lt 12; $w++) {
              $dd = (Invoke-WebRequest -Uri "http://127.0.0.1:8090/api/durum" -TimeoutSec 30 -UseBasicParsing).Content | ConvertFrom-Json
              if ($dd.hazir -and $dd.ligler -and $dd.ligler.Count -gt 0) { break }
              Write-Host ("VERI_BEKLE: " + $w)
              Start-Sleep -Seconds 5
            }
            $lig = $dd.ligler[0].ad
            Write-Host ("SECILEN_LIG: " + $lig)
            $mm = (Invoke-WebRequest -Uri ("http://127.0.0.1:8090/api/maclar/" + [uri]::EscapeDataString($lig)) -TimeoutSec 30 -UseBasicParsing).Content | ConvertFrom-Json
            $liste = $mm.gelecek
            if (-not $liste -or $liste.Count -eq 0) { $liste = $mm.sonuclar }
            Write-Host ("ADAY_SAYI: " + $liste.Count)
            # Gecerli tahmin veren mac bul (deneme yanilma) — ASCII guvenli
            $d = $null
            foreach ($cand in $liste | Select-Object -First 25) {
              # Turkce karakter icermeyen adlari tercih et (PowerShell JSON sorunu)
              $tr = [char]0x130 + [char]0x131 + [char]0x15E + [char]0x15F + [char]0xE7 + [char]0xC7 + [char]0xF6 + [char]0xD6 + [char]0xFC + [char]0xDC + [char]0x11F + [char]0x11E + [char]0x15E
              if ($cand.ev.IndexOfAny($tr.ToCharArray()) -ge 0 -or $cand.dep.IndexOfAny($tr.ToCharArray()) -ge 0) { continue }
              $govde = @{ ev = $cand.ev; dep = $cand.dep; lig = $lig } | ConvertTo-Json -Compress
              $baytlar = [System.Text.Encoding]::UTF8.GetBytes($govde)
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/api/tahmin" -Method POST -Body $baytlar -ContentType "application/json; charset=utf-8" -TimeoutSec 60 -UseBasicParsing
                $tmp = $r.Content | ConvertFrom-Json
                if ($null -ne $tmp.ev_kazanma -and $null -eq $tmp.hata) {
                  $d = $tmp
                  Write-Host ("SECILEN_MAC: " + $cand.ev + " vs " + $cand.dep)
                  break
                }
                Write-Host ("ATLANDI: " + $cand.ev + " (" + $tmp.hata + ")")
              } catch { Write-Host ("HATA: " + $_.Exception.Message) }
            }
            if ($null -eq $d) { throw "Gecerli mac bulunamadi" }
            Write-Host ("TAHMIN_KOD: 200")
            Write-Host ("MOTOR: " + $d.motor)
            Write-Host ("SIMULASYON: " + $d.simulasyon)
            Write-Host ("EV_KAZANMA: " + $d.ev_kazanma)
            Write-Host ("BERABERLIK: " + $d.beraberlik)
            Write-Host ("DEP_KAZANMA: " + $d.dep_kazanma)
            Write-Host ("GUVEN_SKORU: " + $d.ajan.guven_skoru)
            Write-Host ("GUVEN_SEVIYE: " + $d.ajan.guven)
            Write-Host ("ANA_TAHMIN: " + $d.ajan.ana_tahmin)
            Write-Host ("TAVSIYE_SAYI: " + $d.ajan.tavsiyeler.Count)
            Write-Host ("BER_risk: " + $d.ajan.ber_risk)
            Write-Host ("SKOR_SAYI: " + $d.en_skorlar.Count)
            Write-Host ("EN_IYI_SKOR: " + $d.en_skorlar[0].skor)
            Write-Host ("KG_VAR: " + $d.kg_var)
            Write-Host ("UST25: " + $d.ust_25)
          } catch { Write-Host ("TAHMIN_HATA: " + $_.Exception.Message) }

      - name: CANLI SAYFA
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/canli" -TimeoutSec 10 -UseBasicParsing
            Write-Host ("CANLI_KOD: " + $r.StatusCode)
            Write-Host ("CANLI_SAHA: " + ($r.Content -match 'id="saha"'))
            Write-Host ("CANLI_TOP: " + ($r.Content -match "TOP_ZAMAN"))
            Write-Host ("CANLI_MOMENTUM: " + ($r.Content -match "momVeri.push"))
            Write-Host ("CANLI_KAYAN: " + ($r.Content -match "kayanYukle"))
          } catch { Write-Host "CANLI_HATA" }

      - name: EKRAN GORUNTUSU (adim adim)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function EkranAl($ad) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$ad.png")
            $g.Dispose(); $bmp.Dispose()
            Write-Host ("EKRAN: " + $ad)
          }
          # 5, 15, 30, 45, 60. saniyelerde ekran goruntusu
          Start-Sleep -Seconds 5
          EkranAl "t05_saniye"
          Start-Sleep -Seconds 10
          EkranAl "t15_saniye"
          Start-Sleep -Seconds 15
          EkranAl "t30_saniye"
          Start-Sleep -Seconds 15
          EkranAl "t45_saniye"
          Start-Sleep -Seconds 15
          EkranAl "t60_saniye"

      - name: LOG DOSYASI OKU
        shell: powershell
        run: |
          $log = Join-Path $env:USERPROFILE "SporTahmin_log.txt"
          if (Test-Path $log) {
            Write-Host "===== UYGULAMA LOG DOSYASI ====="
            Get-Content $log | ForEach-Object { Write-Host $_ }
            Write-Host "===== LOG SONU ====="
          } else {
            Write-Host "LOG_DOSYASI_YOK: $log"
          }

      - name: API DURUM KONTROL
        shell: powershell
        run: |
          try {
            $d = (Invoke-WebRequest -Uri "http://127.0.0.1:8090/api/durum" -TimeoutSec 20 -UseBasicParsing).Content | ConvertFrom-Json
            Write-Host ("DURUM_hazir: " + $d.hazir)
            Write-Host ("DURUM_tam: " + $d.tam)
            Write-Host ("DURUM_toplam: " + $d.toplam)
            Write-Host ("DURUM_ligler: " + $d.ligler.Count)
            Write-Host ("DURUM_hata: " + $d.hata)
          } catch { Write-Host ("DURUM_HATA: " + $_.Exception.Message) }

      - name: PYTHON EKRAN (yedek)
        run: |
          pip install pillow
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('ekran_py.png'); print('Python ekran OK')"

      - name: SURUM KONTROL
        shell: powershell
        run: |
          $e = "dist\SporTahmin\SporTahmin.exe"
          if (Test-Path $e) {
            $v = (Get-Item $e).VersionInfo
            Write-Host ("EXE_SURUM: " + $v.FileVersion)
            Write-Host ("EXE_URUN: " + $v.ProductName)
            Write-Host ("EXE_YAYINCI: " + $v.CompanyName)
            Write-Host ("EXE_ACIKLAMA: " + $v.FileDescription)
            $h = (Get-FileHash $e -Algorithm MD5).Hash
            Write-Host ("EXE_MD5: " + $h)
            Write-Host ("EXE_BOYUT: " + (Get-Item $e).Length)
          } else { Write-Host "EXE_YOK" }

      - name: Inno Setup kur
        run: choco install innosetup -y --no-progress

      - name: Kurulum paketi derle
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" kurulum.iss
          dir kurulum_cikti

      - name: Kurulum dogrula
        shell: powershell
        run: |
          $k = "kurulum_cikti\SporTahmin_Kurulum.exe"
          if (Test-Path $k) {
            $b = (Get-Item $k).Length
            Write-Host ("KURULUM_BOYUT: " + $b)
            Write-Host ("KURULUM_MB: " + [math]::Round($b/1MB, 2))
            $h = (Get-FileHash $k -Algorithm MD5).Hash
            Write-Host ("KURULUM_MD5: " + $h)
          } else { Write-Host "KURULUM_YOK" }

      - name: Artifactlar
        uses: actions/upload-artifact@v4
        with:
          name: SONUC
          path: |
            ekran_ana.png
            ekran_py.png
            t05_saniye.png
            t15_saniye.png
            t30_saniye.png
            t45_saniye.png
            t60_saniye.png
            dist/SporTahmin/SporTahmin.exe
            kurulum_cikti/SporTahmin_Kurulum.exe
          if-no-files-found: warn

      # ═══ OTOMATIK RELEASE ═══
      # Surum numarasini app.py'den oku, release olustur + exe'leri ekle
      - name: Surum numarasi al
        id: surum
        shell: bash
        run: |
          S=$(grep -oP '"surum":\s*"\K[0-9.]+' app.py | head -1)
          echo "surum=$S" >> $GITHUB_OUTPUT
          echo "SURUM_BULUNDU=$S"

      - name: Release olustur ve yukle
        if: steps.surum.outputs.surum != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.surum }}
          name: Spor Tahmin v${{ steps.surum.outputs.surum }}
          body: |
            Spor Tahmin v${{ steps.surum.outputs.surum }}
            Otomatik derleme — GitHub Actions
          files: |
            dist/SporTahmin/SporTahmin.exe
            kurulum_cikti/SporTahmin_Kurulum.exe
          fail_on_unmatched_files: false
