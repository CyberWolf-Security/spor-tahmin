name: Windows EXE Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pyinstaller

      - name: EXE derle
        run: |
          pyinstaller --onefile --name SporTahmin --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug --noconsole app.py

      - name: Dosyalari listele
        run: dir dist

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: SporTahmin-Windows
          path: dist/SporTahmin.exe
          retention-days: 30
