name: Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pip
        run: |
          python -m pip install --upgrade pip
          pip install flask pywebview pyinstaller

      - name: Derle
        run: pyinstaller --onefile --noconsole --name SporTahmin --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug --hidden-import=webview --collect-all webview main.py

      - name: Exe boyut
        shell: bash
        run: ls -la dist/

      # ═══ GERCEK WINDOWS TEST — EXE CALISTIR + EKRAN GORUNTUSU ═══
      - name: EXE CALISTIR (arka planda)
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\SporTahmin.exe" -PassThru -WindowStyle Normal
          Write-Host "PID: $($p.Id)"
          # WebView2 penceresi acilana kadar bekle
          Start-Sleep -Seconds 35
          $p | Out-File -Encoding utf8 /tmp_pid.txt
          Write-Host "=== PENCERE LISTESI ==="
          Get-Process | Where-Object {$_.MainWindowTitle -ne ""} | Select-Object Id,ProcessName,MainWindowTitle | Format-Table -AutoSize

      - name: EKRAN GORUNTUSU AL (tam ekran)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\ekran_tam.png")
          Write-Host "Tam ekran kaydedildi"
          # Sadece pencere
          $procs = Get-Process | Where-Object {$_.MainWindowTitle -ne "" -and $_.ProcessName -notlike "*powershell*"}
          foreach ($p in $procs) {
            Write-Host "Pencere: $($p.ProcessName) — $($p.MainWindowTitle)"
          }

      - name: EKRAN GORUNTUSU + HTTP KONTROL
        shell: powershell
        run: |
          # Flask sunucusu ayakta mi?
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/" -TimeoutSec 10 -UseBasicParsing
            Write-Host "HTTP KOD: $($r.StatusCode)"
            $ic = $r.Content
            Write-Host "=== BASLIK KONTROL ==="
            if ($ic -match "Canlı Maç Analiz") { Write-Host "✅ BASLIK: Canlı Maç Analiz (YENI)" }
            elseif ($ic -match "Monte Carlo") { Write-Host "❌ BASLIK: Monte Carlo (ESKI!)" }
            else { Write-Host "? BASLIK bulunamadi" }
            Write-Host "yukGuncelle: $($ic -match 'yukGuncelle')"
            Write-Host "ligDoldur: $($ic -match 'ligDoldur')"
            Write-Host "Monte Carlo: $($ic -match 'Monte Carlo')"
            Write-Host "HTML kapanis: $($ic.TrimEnd().EndsWith('</html>'))"
            Write-Host "ICERIK UZUNLUK: $($ic.Length)"
          } catch {
            Write-Host "❌ HTTP HATA: $_"
          }
          # Ikinci ekran goruntusu (site yuklendikten sonra)
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Start-Sleep -Seconds 3
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\ekran_icerik.png")
          Write-Host "Icerik ekrani kaydedildi"

      - name: CANLI SAYFA KONTROL
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/canli" -TimeoutSec 10 -UseBasicParsing
            Write-Host "CANLI HTTP: $($r.StatusCode) | Uzunluk: $($r.Content.Length)"
            Write-Host "ligDoldur: $($r.Content -match 'ligDoldur')"
            Write-Host "saha: $($r.Content -match 'saha')"
            Write-Host "momentum: $($r.Content -match 'mom')"
          } catch { Write-Host "CANLI HATA: $_" }

      - name: Ekran goruntulerini yukle
        uses: actions/upload-artifact@v4
        with:
          name: EKRAN-GORUNTULERI
          path: |
            ekran_tam.png
            ekran_icerik.png

      - uses: actions/upload-artifact@v4
        with:
          name: SporTahmin
          path: dist/SporTahmin.exe
          if-no-files-found: warn
