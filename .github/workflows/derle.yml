name: Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pip
        run: |
          python -m pip install --upgrade pip
          pip install flask pywebview pyinstaller

      - name: Derle
        run: pyinstaller --onefile --noconsole --name SporTahmin --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug --hidden-import=webview --collect-all webview main.py

      - name: Exe boyut
        shell: bash
        run: ls -la dist/

      # ═══ WINDOWS GERCEK TEST ═══
      - name: EXE CALISTIR + HTTP TEST
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\SporTahmin.exe" -PassThru
          Write-Host "PID: $($p.Id)"
          Start-Sleep -Seconds 40
          $procs = Get-Process | Where-Object {$_.MainWindowTitle -ne ""}
          Write-Host "=== PENCERELER ==="
          foreach ($x in $procs) { Write-Host ("Pencere: " + $x.ProcessName + " | " + $x.MainWindowTitle) }
          
          Write-Host "=== HTTP TEST ==="
          $ok = $false
          for ($i=1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/" -TimeoutSec 8 -UseBasicParsing
              Write-Host ("HTTP KOD: " + $r.StatusCode)
              $ic = $r.Content
              Write-Host ("UZUNLUK: " + $ic.Length)
              Write-Host ("BASLIK_YENI: " + ($ic -match "Canl. Ma. Analiz"))
              Write-Host ("MONTE_CARLO: " + ($ic -match "Monte Carlo"))
              Write-Host ("YUKGUNCELLE: " + ($ic -match "yukGuncelle"))
              Write-Host ("LIGDOLDUR: " + ($ic -match "ligDoldur"))
              Write-Host ("HTML_KAPANIS: " + $ic.TrimEnd().EndsWith("</html>"))
              $ok = $true
              break
            } catch {
              Write-Host ("Deneme " + $i + " basarisiz, bekleniyor...")
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) { Write-Host "HTTP ERISILEMEDI" }

      - name: EKRAN GORUNTUSU (site acikken)
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\ekran1.png")
          Write-Host "Ekran goruntusu 1 kaydedildi"

      - name: PYTHON ILE EKRAN GORUNTUSU (yedek)
        run: |
          pip install pillow
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('ekran2.png'); print('Python ekran goruntusu kaydedildi')"

      - name: CANLI SAYFA KONTROL
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/canli" -TimeoutSec 10 -UseBasicParsing
            Write-Host ("CANLI_HTTP: " + $r.StatusCode)
            Write-Host ("CANLI_UZUNLUK: " + $r.Content.Length)
            Write-Host ("LIGDOLDUR: " + ($r.Content -match "ligDoldur"))
            Write-Host ("SAHA: " + ($r.Content -match "saha"))
            Write-Host ("MOMENTUM: " + ($r.Content -match "mom"))
          } catch { Write-Host "CANLI_HATA" }

      - name: Artifactlar
        uses: actions/upload-artifact@v4
        with:
          name: SONUC
          path: |
            ekran1.png
            ekran2.png
            dist/SporTahmin.exe
          if-no-files-found: warn
