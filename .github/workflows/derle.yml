name: Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pip
        run: |
          python -m pip install --upgrade pip
          pip install flask pywebview pyinstaller

      - name: Derle
        run: pyinstaller --onefile --noconsole --name SporTahmin --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug --hidden-import=webview --collect-all webview main.py

      - name: Exe boyut
        shell: bash
        run: ls -la dist/

      # ═══ WINDOWS GERCEK TEST ═══
      - name: EXE CALISTIR + HTTP TEST
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\SporTahmin.exe" -PassThru
          Write-Host "PID: $($p.Id)"
          Start-Sleep -Seconds 45
          $procs = Get-Process | Where-Object {$_.MainWindowTitle -ne ""}
          foreach ($x in $procs) { Write-Host ("Pencere: " + $x.ProcessName + " | " + $x.MainWindowTitle) }
          Write-Host "=== HTTP TEST ==="
          for ($i=1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/" -TimeoutSec 8 -UseBasicParsing
              Write-Host ("HTTP_KOD: " + $r.StatusCode)
              $ic = $r.Content
              Write-Host ("UZUNLUK: " + $ic.Length)
              Write-Host ("BASLIK: " + ($ic -match "Canl. Ma. Analiz"))
              Write-Host ("SAHA_BLOK: " + ($ic -match "saha-blok"))
              Write-Host ("TAHMIN_SAHA: " + ($ic -match "tahmin-saha"))
              Write-Host ("OYUNCU_CSS: " + ($ic -match "oyuncu.ev"))
              Write-Host ("TOP_CSS: " + ($ic -match "class=.top."))
              Write-Host ("SAHA_BASLA: " + ($ic -match "function sahaBasla"))
              Write-Host ("GOL_ANIM: " + ($ic -match "gol-patlama"))
              Write-Host ("ABORT: " + ($ic -match "AbortController"))
              Write-Host ("SKOR_KARTI: " + ($ic -match "En Olas"))
              Write-Host ("ULKE_GRUP: " + ($ic -match "ulke-bas"))
              Write-Host ("BAYRAK: " + ($ic -match "ULKE_BAYRAK"))
              Write-Host ("GERI_BUTON: " + ($ic -match "analizKapat"))
              Write-Host ("KAYAN_TIKLA: " + ($ic -match "canliMaciAc"))
              Write-Host ("SAHA_MOTOR: " + ($ic -match "oyuncuyaGit"))
              Write-Host ("HTML_KAPANIS: " + $ic.TrimEnd().EndsWith("</html>"))
              break
            } catch { Write-Host ("Deneme " + $i + " basarisiz"); Start-Sleep -Seconds 5 }
          }

      - name: TAHMIN TESTI
        shell: powershell
        run: |
          try {
            # Once lig listesinden gercek bir lig + takim cifti sec
            $dd = (Invoke-WebRequest -Uri "http://127.0.0.1:8090/api/durum" -TimeoutSec 30 -UseBasicParsing).Content | ConvertFrom-Json
            $lig = $dd.ligler[0].ad
            Write-Host ("SECILEN_LIG: " + $lig)
            $mm = (Invoke-WebRequest -Uri ("http://127.0.0.1:8090/api/maclar/" + [uri]::EscapeDataString($lig)) -TimeoutSec 30 -UseBasicParsing).Content | ConvertFrom-Json
            $ev = $mm[0].ev; $dep = $mm[0].dep
            Write-Host ("MAC: " + $ev + " vs " + $dep)
            $govde = @{ ev = $ev; dep = $dep; lig = $lig } | ConvertTo-Json -Compress
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/api/tahmin" -Method POST -Body $govde -ContentType "application/json" -TimeoutSec 120 -UseBasicParsing
            Write-Host ("TAHMIN_KOD: " + $r.StatusCode)
            $d = $r.Content | ConvertFrom-Json
            Write-Host ("MOTOR: " + $d.motor)
            Write-Host ("SIMULASYON: " + $d.simulasyon)
            Write-Host ("EV_KAZANMA: " + $d.ev_kazanma)
            Write-Host ("BERABERLIK: " + $d.beraberlik)
            Write-Host ("DEP_KAZANMA: " + $d.dep_kazanma)
            Write-Host ("GUVEN_SKORU: " + $d.ajan.guven_skoru)
            Write-Host ("GUVEN_SEVIYE: " + $d.ajan.guven)
            Write-Host ("ANA_TAHMIN: " + $d.ajan.ana_tahmin)
            Write-Host ("TAVSIYE_SAYI: " + $d.ajan.tavsiyeler.Count)
            Write-Host ("BER_risk: " + $d.ajan.ber_risk)
            Write-Host ("SKOR_SAYI: " + $d.en_skorlar.Count)
            Write-Host ("EN_IYI_SKOR: " + $d.en_skorlar[0].skor)
            Write-Host ("KG_VAR: " + $d.kg_var)
            Write-Host ("UST25: " + $d.ust_25)
          } catch { Write-Host ("TAHMIN_HATA: " + $_.Exception.Message) }

      - name: CANLI SAYFA
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8090/canli" -TimeoutSec 10 -UseBasicParsing
            Write-Host ("CANLI_KOD: " + $r.StatusCode)
            Write-Host ("CANLI_SAHA: " + ($r.Content -match 'id="saha"'))
            Write-Host ("CANLI_TOP: " + ($r.Content -match "TOP_ZAMAN"))
            Write-Host ("CANLI_MOMENTUM: " + ($r.Content -match "momVeri.push"))
            Write-Host ("CANLI_KAYAN: " + ($r.Content -match "kayanYukle"))
          } catch { Write-Host "CANLI_HATA" }

      - name: EKRAN GORUNTUSU
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Start-Sleep -Seconds 3
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\ekran_ana.png")
          Write-Host "Ana ekran kaydedildi"

      - name: PYTHON EKRAN (yedek)
        run: |
          pip install pillow
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('ekran_py.png'); print('Python ekran OK')"

      - name: Artifactlar
        uses: actions/upload-artifact@v4
        with:
          name: SONUC
          path: |
            ekran_ana.png
            ekran_py.png
            dist/SporTahmin.exe
          if-no-files-found: warn
