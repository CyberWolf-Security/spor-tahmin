name: Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pip
        run: |
          python -m pip install --upgrade pip
          pip install flask pywebview pyinstaller
      - name: Test
        run: |
          python -c "import flask; print('flask', flask.__version__)"
          python -c "import webview; print('pywebview OK')"
      - name: Derle
        run: pyinstaller --onefile --noconsole --name SporTahmin --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug --hidden-import=webview --collect-all webview main.py
      - name: Kontrol
        run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: SporTahmin
          path: dist/SporTahmin.exe
          if-no-files-found: warn
