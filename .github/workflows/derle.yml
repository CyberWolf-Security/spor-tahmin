name: Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pip
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pyinstaller

      - name: Test (import)
        run: |
          python -c "import flask, requests; print('OK flask', flask.__version__)"
          python -c "import app; print('app OK')"

      - name: Derle
        run: |
          pyinstaller --onefile --name SporTahmin --add-data "templates;templates" --add-data "veri;veri" --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug app.py 2>&1 | tee build.txt

      - name: Hata varsa goster
        if: failure()
        run: |
          echo "=== BUILD.TXT ==="
          type build.txt

      - name: Yukle
        uses: actions/upload-artifact@v4
        with:
          name: SporTahmin
          path: dist/SporTahmin.exe
          if-no-files-found: warn
